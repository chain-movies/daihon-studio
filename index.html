<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台本スタジオ">

<title>ショートドラマ台本スタジオ</title>
<style>
:root{
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#232322; --surface3:#2b2b29;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --hairline:rgba(255,255,255,0.10);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,0.16);
  --green:#008300; --magenta:#d55181; --yellow:#c98500;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:14px; line-height:1.65;
}
#app{display:flex; height:100vh; overflow:hidden;}

/* ===== sidebar ===== */
.sidebar{
  width:236px; flex:0 0 236px; background:var(--surface);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 14px 14px;
  gap:6px;
}
.logo{display:flex; align-items:center; gap:9px; padding:2px 8px 14px;}
.logo .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(135deg,#3987e5,#9085e9);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.logo .t1{font-weight:700; font-size:14.5px; letter-spacing:.02em;}
.logo .t2{font-size:10.5px; color:var(--muted); letter-spacing:.08em;}
.side-label{font-size:10.5px; color:var(--muted); letter-spacing:.1em; padding:10px 8px 4px;}
.series-picker select{width:100%;}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:9px; cursor:pointer; border:none;
  background:transparent; color:var(--ink2); font-size:13.5px; text-align:left;
  font-family:inherit; width:100%;
}
.nav-item .ic{width:20px; text-align:center; font-size:14px;}
.nav-item:hover{background:var(--surface2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:#a8ccf5; font-weight:600;}
.nav-item:disabled{opacity:.35; cursor:not-allowed;}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
.save-status{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; padding:0 4px;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
.save-dot.on{background:var(--good);}
.save-dot.off{background:var(--warn);}

/* ===== main ===== */
.main{flex:1; overflow-y:auto; padding:26px 30px 60px;}
.view-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
.view-head h1{font-size:20px; font-weight:700; letter-spacing:.01em;}
.view-head .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}
.head-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* ===== buttons ===== */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 14px; border-radius:9px; border:1px solid var(--hairline);
  background:var(--surface2); color:var(--ink); font-size:13px; cursor:pointer;
  font-family:inherit; line-height:1.4; white-space:nowrap;
}
.btn:hover{background:var(--surface3);}
.btn-primary{background:var(--accent); border-color:transparent; font-weight:600;}
.btn-primary:hover{background:#4b93ea;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink2);}
.btn-ghost:hover{background:var(--surface2); color:var(--ink);}
.btn-danger{color:#f0908f;}
.btn-danger:hover{background:rgba(208,59,59,.14);}
.btn-sm{padding:4px 10px; font-size:12px; border-radius:7px;}
.btn-icon{padding:4px 8px; font-size:12px; border-radius:7px; background:transparent; border-color:transparent; color:var(--muted);}
.btn-icon:hover{background:var(--surface3); color:var(--ink);}
.btn-ai{background:linear-gradient(135deg,rgba(57,135,229,.25),rgba(144,133,233,.25)); border:1px solid rgba(144,133,233,.4);}
.btn-ai:hover{background:linear-gradient(135deg,rgba(57,135,229,.4),rgba(144,133,233,.4));}

/* ===== forms ===== */
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--surface2); border:1px solid var(--hairline); color:var(--ink);
  border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; line-height:1.6;
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(57,135,229,.55); outline-offset:0; border-color:transparent;}
textarea{resize:vertical; min-height:60px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field>label{font-size:11.5px; color:var(--muted); letter-spacing:.04em;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:11px; color:var(--muted);}

/* ===== cards / badges ===== */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; padding:2.5px 9px; border-radius:99px;
  background:var(--surface3); color:var(--ink2); border:1px solid var(--hairline);
  white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.st-構想中 .dot{background:var(--muted);}
.badge.st-執筆中 .dot{background:var(--accent);}
.badge.st-完成 .dot{background:var(--good);}
.badge.st-公開済 .dot{background:var(--magenta);}
.badge.st-公開中 .dot{background:var(--magenta);}
.badge.st-完結 .dot{background:var(--good);}
.section-title{font-size:14.5px; font-weight:700; margin:26px 0 12px; display:flex; align-items:center; gap:10px; justify-content:space-between;}
.section-title .r{display:flex; gap:8px;}

/* ===== home series cards ===== */
.series-card{cursor:pointer; transition:border-color .15s;}
.series-card:hover{border-color:rgba(57,135,229,.5);}
.series-card h3{font-size:16px; margin-bottom:2px;}
.series-card .genre{color:var(--muted); font-size:12px;}
.series-card .logline{color:var(--ink2); font-size:12.5px; margin:10px 0 12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.series-card .meta{display:flex; gap:14px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px;}
.series-card .meta b{color:var(--ink2); font-weight:600;}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}

/* ===== episode cards ===== */
.ep-card{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:14px 16px; margin-bottom:12px;}
.ep-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.ep-no{
  font-weight:800; font-size:13px; color:#a8ccf5; background:var(--accent-soft);
  border-radius:7px; padding:2px 9px; flex:0 0 auto;
}
.ep-head input.ep-title{flex:1; min-width:160px; background:transparent; border-color:transparent; font-size:14.5px; font-weight:600; padding:4px 6px;}
.ep-head input.ep-title:hover{background:var(--surface2);}
.ep-tools{display:flex; gap:2px; margin-left:auto;}
.plotgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.plotcell label{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-bottom:4px;}
.plotcell label .tag{font-size:9.5px; padding:1px 6px; border-radius:4px; font-weight:700; letter-spacing:.05em;}
.tag-hook{background:rgba(201,133,0,.2); color:#eda100;}
.tag-cliff{background:rgba(213,81,129,.18); color:#e87ba4;}
.plotcell textarea{min-height:52px; font-size:12.5px;}
@media(max-width:900px){.plotgrid{grid-template-columns:1fr;}}

/* ===== character cards ===== */
.char-card{position:relative;}
.char-color{width:12px; height:12px; border-radius:4px; flex:0 0 12px;}
.char-name-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.char-name-row input{font-weight:700; font-size:15px; background:transparent; border-color:transparent; padding:4px 6px;}
.char-name-row input:hover{background:var(--surface2);}

/* ===== script editor ===== */
.script-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:12px 16px; margin-bottom:14px; position:sticky; top:0; z-index:5;
}
.timebar{flex:1; min-width:220px;}
.timebar .tb-label{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:5px;}
.timebar .tb-label b{color:var(--ink); font-size:12.5px;}
.tb-track{height:8px; border-radius:99px; background:var(--surface3); overflow:hidden; position:relative;}
.tb-fill{height:100%; border-radius:99px; background:var(--accent); transition:width .2s;}
.tb-fill.over{background:var(--crit);}
.tb-fill.near{background:var(--yellow);}
.script-lines{display:flex; flex-direction:column; gap:6px;}
.line-row{
  display:flex; gap:8px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
}
.line-row.t-scene{background:#20242b; border-color:#2e3947;}
.line-row.t-action{}
.line-row.t-serif{}
.line-time{
  flex:0 0 52px; text-align:right; font-size:10.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; padding-top:8px;
}
.line-time.inhook{color:#eda100; font-weight:700;}
.line-type{flex:0 0 84px;}
.line-type select{padding:5px 6px; font-size:11.5px;}
.line-char{flex:0 0 110px;}
.line-char select{padding:5px 6px; font-size:11.5px;}
.line-text{flex:1;}
.line-text textarea{min-height:34px; padding:6px 10px; font-size:13.5px; overflow:hidden;}
.line-row.t-scene textarea{font-weight:700; color:#a8ccf5;}
.line-row.t-action textarea{color:var(--ink2); font-style:normal;}
.line-ops{display:flex; flex-direction:column; gap:0; flex:0 0 auto;}
.line-ops .btn-icon{padding:2px 6px; font-size:11px;}
.line-sec{flex:0 0 44px; font-size:10.5px; color:var(--muted); text-align:right; padding-top:8px; font-variant-numeric:tabular-nums;}
.addline-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.hook-guide{
  font-size:11px; color:#eda100; background:rgba(201,133,0,.1);
  border:1px dashed rgba(201,133,0,.4); border-radius:8px; padding:6px 12px; margin:4px 0 10px;
}

/* ===== analytics ===== */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
.kpi .k-label{font-size:11px; color:var(--muted); letter-spacing:.04em;}
.kpi .k-val{font-size:23px; font-weight:800; margin-top:2px; letter-spacing:.01em;}
.kpi .k-sub{font-size:10.5px; color:var(--muted); margin-top:1px;}
.chart-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.chart-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
.chart-head h3{font-size:13.5px; font-weight:700;}
.chart-head select{width:auto; font-size:12px; padding:4px 8px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-left:auto;}
.legend .lg{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink2);}
.legend .sw{width:10px; height:10px; border-radius:3px;}
.chart-svg-wrap{position:relative;}
.chart-tip{
  position:absolute; pointer-events:none; z-index:8; display:none;
  background:#2b2b29; border:1px solid var(--hairline); border-radius:8px;
  padding:6px 10px; font-size:11.5px; box-shadow:0 6px 20px rgba(0,0,0,.45);
  white-space:nowrap;
}
.chart-tip b{font-size:12.5px;}
table.rec-table{width:100%; border-collapse:collapse; font-size:12px;}
.rec-table th{
  text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; letter-spacing:.04em;
  padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.rec-table td{padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums;}
.rec-table tr:hover td{background:var(--surface2);}
.pf-chip{display:inline-flex; align-items:center; gap:6px;}
.pf-chip .sw{width:9px;height:9px;border-radius:3px;}
.retro-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
@media(max-width:900px){.retro-grid{grid-template-columns:1fr;}}
.retro-cell label{font-size:11px; margin-bottom:4px; display:block; font-weight:700;}
.retro-cell.keep label{color:#7fd07f;}
.retro-cell.prob label{color:#f0a58a;}
.retro-cell.try label{color:#a8ccf5;}
.retro-cell textarea{min-height:64px; font-size:12.5px;}

/* ===== global search ===== */
.search-wrap{position:relative;}
.search-wrap input{padding-left:30px;}
.search-wrap .sic{position:absolute; left:9px; top:8px; font-size:12px; color:var(--muted); pointer-events:none;}
.search-pop{
  position:fixed; left:250px; top:64px; width:min(560px, calc(100vw - 270px));
  max-height:70vh; overflow-y:auto; background:var(--surface);
  border:1px solid var(--hairline); border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.65); z-index:45; padding:8px;
}
.sr-item{display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--ink); font-family:inherit; padding:9px 10px; border-radius:9px; cursor:pointer; font-size:12.5px; line-height:1.6;}
.sr-item:hover{background:var(--surface2);}
.sr-item .sr-meta{font-size:10.5px; color:var(--muted); display:flex; gap:8px; margin-bottom:2px; align-items:center;}
.sr-item mark{background:rgba(201,133,0,.35); color:#ffd47f; border-radius:3px; padding:0 1px;}
.sr-type{font-size:9.5px; padding:1px 6px; border-radius:4px; background:var(--surface3); color:var(--ink2); flex:0 0 auto;}
.sr-empty{padding:16px; color:var(--muted); font-size:12px; text-align:center;}
.line-row.flash{animation:flashbg 1.8s;}
@keyframes flashbg{0%{background:rgba(201,133,0,.4);}100%{background:var(--surface);}}

/* ===== script layout + plot side panel ===== */
.script-wrap{display:flex; gap:16px; align-items:flex-start;}
.script-main{flex:1; min-width:0;}
.plot-side{flex:0 0 274px; position:sticky; top:84px; display:flex; flex-direction:column; gap:9px;}
.ps-title{font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px; justify-content:space-between; padding:0 2px;}
.plot-side .ps-cell{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 11px;}
.plot-side .ps-cell label{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted); margin-bottom:4px;}
.plot-side .ps-cell label .tag{font-size:9px; padding:1px 6px; border-radius:4px; font-weight:700;}
.plot-side textarea{min-height:42px; font-size:11.5px; padding:5px 8px;}
@media(max-width:1100px){
  .script-wrap{flex-direction:column-reverse;}
  .plot-side{position:static; width:100%; flex-direction:row; flex-wrap:wrap;}
  .plot-side .ps-cell{flex:1 1 220px;}
  .ps-title{flex:1 1 100%;}
}

/* ===== health check ===== */
.health-chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 13px;
  border-radius:99px; border:1px solid var(--hairline); cursor:pointer;
  background:var(--surface2); color:var(--ink); font-size:12px; font-weight:700; font-family:inherit;
}
.health-chip:hover{background:var(--surface3);}
.hl-score{display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
.hl-score .num{font-size:38px; font-weight:800; line-height:1;}
.hl-score .den{color:var(--muted); font-size:13px;}
.hl-item{display:flex; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; align-items:flex-start; font-size:12.5px;}
.hl-item .st{flex:0 0 22px; font-size:14px; padding-top:1px;}
.hl-item .tt{font-weight:700; font-size:12.5px;}
.hl-item .tt .pts{font-weight:400; color:var(--muted); font-size:10.5px; margin-left:6px;}
.hl-item .dd{color:var(--ink2); font-size:11.5px; margin-top:1px;}
.hl-item .jump{margin-left:auto; flex:0 0 auto;}

/* ===== templates ===== */
.tpl-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tpl-card{border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--surface2); text-align:left; font-family:inherit; color:var(--ink);}
.tpl-card:hover{border-color:rgba(57,135,229,.6); background:var(--surface3);}
.tpl-card h4{font-size:13.5px; margin-bottom:3px;}
.tpl-card p{font-size:11px; color:var(--ink2); line-height:1.6;}
@media(max-width:700px){.tpl-grid{grid-template-columns:1fr;}}

/* ===== phone preview ===== */
.pv-stage{display:flex; gap:20px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}
.phone{
  width:282px; height:501px; border-radius:30px; border:3px solid #3c3c3a;
  background:linear-gradient(165deg,#232837 0%,#171923 55%,#101016 100%);
  position:relative; overflow:hidden; flex:0 0 auto;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.pv-progress{position:absolute; top:10px; left:12px; right:12px; height:3px; background:rgba(255,255,255,.16); border-radius:99px;}
.pv-progress i{display:block; height:100%; background:#fff; border-radius:99px; width:0%;}
.pv-hookbadge{position:absolute; top:20px; left:12px; font-size:9.5px; color:#eda100; background:rgba(0,0,0,.5); padding:2px 9px; border-radius:99px;}
.pv-scene{position:absolute; top:46px; left:12px; right:12px; text-align:center; font-size:10.5px; color:#9fb4d4; letter-spacing:.08em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pv-action{position:absolute; top:46%; left:20px; right:20px; transform:translateY(-50%); text-align:center; color:#b9b8ae; font-size:12px; line-height:1.9;}
.pv-serif{position:absolute; bottom:52px; left:14px; right:14px; text-align:center;}
.pv-serif .pv-name{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 11px; border-radius:99px; margin-bottom:8px; background:rgba(0,0,0,.55);}
.pv-serif .pv-text{font-size:16.5px; font-weight:800; color:#fff; line-height:1.55; text-shadow:0 2px 7px rgba(0,0,0,.95), 0 0 2px #000;}
.pv-time{position:absolute; bottom:13px; right:14px; font-size:10px; color:rgba(255,255,255,.65); font-variant-numeric:tabular-nums;}
.pv-controls{display:flex; flex-direction:column; gap:10px; min-width:170px; max-width:220px;}

/* ===== modal ===== */
.modal-back{
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
  display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px;
  backdrop-filter:blur(3px);
}
.modal{
  background:var(--surface); border:1px solid var(--hairline); border-radius:16px;
  width:100%; max-width:640px; max-height:86vh; overflow-y:auto; padding:22px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal.wide{max-width:820px;}
.modal h2{font-size:16.5px; margin-bottom:16px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

/* ===== toast / empty ===== */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#2b2b29; border:1px solid var(--hairline); color:var(--ink);
  padding:9px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
  transition:all .25s; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.empty{
  text-align:center; color:var(--muted); padding:56px 20px;
  border:1px dashed var(--line); border-radius:var(--radius); font-size:13px;
}
.empty .big{font-size:34px; margin-bottom:10px;}

/* ===== mobile / touch ===== */
@media (display-mode: standalone){
  #app{padding-top:env(safe-area-inset-top);}
  .main{padding-bottom:calc(60px + env(safe-area-inset-bottom));}
}
@media(max-width:560px){
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px;} /* iOSの自動ズーム防止 */
  .btn{padding:10px 15px;}
  .btn-icon{padding:7px 11px; font-size:14px;}
  .line-row{flex-wrap:wrap; row-gap:6px;}
  .line-time{flex:0 0 auto; order:1; padding-top:9px;}
  .line-type{order:2; flex:0 0 auto;}
  .line-type select{width:auto;}
  .line-char{order:3; flex:1 1 auto;}
  .line-sec{order:4; padding-top:9px;}
  .line-ops{order:5; flex-direction:row;}
  .line-text{order:6; flex:1 1 100%;}
  .kpis{grid-template-columns:1fr 1fr;}
  .modal{padding:16px 14px;}
  .view-head h1{font-size:17px;}
  .pv-stage .phone{width:236px; height:419px;}
  .rec-table{font-size:11px;}
}
@media(max-width:760px){
  #app{flex-direction:column;}
  .sidebar{width:100%; flex:0 0 auto; flex-direction:row; flex-wrap:wrap; align-items:center; border-right:none; border-bottom:1px solid var(--line); padding:10px 12px; gap:8px;}
  .logo{padding:0;}
  .side-label{display:none;}
  .series-picker{flex:1; min-width:140px;}
  .search-wrap{flex:1; min-width:130px;}
  .nav{flex-direction:row; overflow-x:auto; margin:0; flex:1 1 100%;}
  .nav-item{width:auto; flex:0 0 auto; white-space:nowrap; padding:7px 11px;}
  .side-foot{margin:0; border:none; padding:0; flex-direction:row;}
  .main{padding:16px 14px 60px;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="mark">🎬</div>
      <div>
        <div class="t1">台本スタジオ</div>
        <div class="t2">SHORT DRAMA WRITER</div>
      </div>
    </div>
    <div class="side-label">作品を選択</div>
    <div class="series-picker"><select id="seriesSelect"></select></div>
    <div class="side-label">検索</div>
    <div class="search-wrap"><span class="sic">🔍</span><input type="text" id="globalSearch" placeholder="セリフ・話・キャラを検索" autocomplete="off"></div>
    <div class="side-label">メニュー</div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-action="nav" data-view="home"><span class="ic">🏠</span>作品一覧</button>
      <button class="nav-item" data-action="nav" data-view="plot"><span class="ic">🧩</span>プロット設計</button>
      <button class="nav-item" data-action="nav" data-view="chars"><span class="ic">👥</span>キャラクター</button>
      <button class="nav-item" data-action="nav" data-view="script"><span class="ic">📝</span>台本エディタ</button>
      <button class="nav-item" data-action="nav" data-view="analytics"><span class="ic">📈</span>分析・PDCA</button>
    </nav>
    <div class="side-foot">
      <div class="save-status"><span class="save-dot" id="saveDot"></span><span id="saveMsg">…</span></div>
      <button class="btn btn-sm" id="btnExport">💾 JSONで保存</button>
      <button class="btn btn-sm btn-ghost" id="btnImport">📂 JSONを読み込み</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="searchPop" class="search-pop" style="display:none"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
/* ================= ショートドラマ台本スタジオ ================= */
'use strict';

/* ---------- 定数 ---------- */
const LS_KEY = 'shortdrama-studio-v1';
const PLATFORMS = [
  {id:'tiktok', label:'TikTok',            color:'#3987e5'},
  {id:'reels',  label:'Instagramリール',    color:'#008300'},
  {id:'shorts', label:'YouTubeショート',    color:'#d55181'},
  {id:'other',  label:'その他',             color:'#c98500'},
];
const CHAR_COLORS = ['#3987e5','#d55181','#c98500','#199e70','#d95926','#9085e9','#e66767','#008300'];
const SERIES_STATUS = ['構想中','執筆中','公開中','完結'];
const EP_STATUS = ['構想中','執筆中','完成','公開済'];
const CHAR_ROLES = ['主人公','相手役','敵役','脇役','その他'];
const METRICS = [
  {id:'views',      label:'再生数',            unit:''},
  {id:'completion', label:'完視聴率',          unit:'%'},
  {id:'avgWatch',   label:'平均視聴時間',      unit:'秒'},
  {id:'likes',      label:'いいね',            unit:''},
  {id:'saves',      label:'保存数',            unit:''},
  {id:'shares',     label:'シェア数',          unit:''},
  {id:'follows',    label:'フォロワー増',      unit:''},
];

/* ---------- ユーティリティ ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sel = (a,b) => String(a)===String(b) ? ' selected' : '';
const fmtNum = n => {
  n = Number(n)||0;
  if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'億';
  if (n >= 10000)     return (n/10000).toFixed(1).replace(/\.0$/,'')+'万';
  return n.toLocaleString('ja-JP');
};
const fmtSec = s => {
  s = Math.round(s);
  const m = Math.floor(s/60), r = s%60;
  return m > 0 ? `${m}分${String(r).padStart(2,'0')}秒` : `${r}秒`;
};

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 状態 ---------- */
let state = null;
let ui = { view:'home', seriesId:null, epId:null };
let lsAvailable = true;
let dirty = false;

function blankSeries(title){
  return {
    id: uid(), title: title||'新しい作品', genre:'', status:'構想中',
    logline:'', audience:'', targetSec:90, arc:'', world:'',
    characters: [], episodes: [],
  };
}
function blankEpisode(){
  return {
    id: uid(), title:'', status:'構想中',
    hook:'', development:'', twist:'', cliff:'',
    script: [], records: [], retro: {keep:'', problem:'', try:''},
  };
}
const blankLine = (type) => ({ id: uid(), type: type||'serif', charId:'', text:'' });

function seedData(){
  const s = blankSeries('サンプル：身代わりの婚約者');
  s.genre = '恋愛 × 復讐'; s.status = '公開中'; s.targetSec = 75;
  s.logline = '姉の身代わりで御曹司とお見合いさせられた地味な妹・美咲。しかし相手は、かつて彼女だけが助けた初恋の人だった——。';
  s.audience = '20〜40代女性 / 通勤・寝る前のスキマ時間視聴';
  s.arc = '全10話想定。1〜3話:身代わり成立と正体バレの危機 / 4〜7話:姉の妨害と両想いのすれ違い / 8〜10話:正体露見→どん底→逆転プロポーズ。';
  s.world = '現代日本。老舗ホテルグループの御曹司×町の花屋の看板娘。SNSでの炎上・拡散を小道具に使う。';
  const c1 = { id:uid(), name:'美咲', role:'主人公', age:'24', profile:'花屋勤務の地味な妹。眼鏡・ひとつ結び。実は姉より有能で気が利く。', tone:'丁寧だが本音がこぼれる。「…って、言えるわけないでしょ」', relation:'玲奈の妹。蓮とは10年前に一度会っている。' };
  const c2 = { id:uid(), name:'蓮', role:'相手役', age:'28', profile:'ホテルグループ御曹司。完璧に見えて人間不信。10年前に助けてくれた少女を探し続けている。', tone:'冷静・短文。動揺すると敬語が崩れる。「——君、名前は?」', relation:'美咲が初恋の相手だとまだ気づいていない。' };
  const c3 = { id:uid(), name:'玲奈', role:'敵役', age:'27', profile:'美咲の姉。SNSインフルエンサー。お見合いをドタキャンして妹を身代わりに立てた張本人。', tone:'外面は甘く、裏では命令口調。「アンタは黙って座ってればいいの」', relation:'妹を見下しているが、蓮の正体を知り豹変する。' };
  s.characters = [c1, c2, c3];

  const e1 = blankEpisode();
  e1.title = '身代わりのお見合い'; e1.status = '公開済';
  e1.hook = '「アンタ、今日から私になりなさい」姉に高級ドレスを投げつけられる冒頭2秒。';
  e1.development = '訳も分からずお見合い会場へ。緊張でグラスを倒すが、相手の男は怒らず静かにハンカチを差し出す。';
  e1.twist = '男の左手首に、10年前に美咲が巻いた包帯と同じ位置の傷跡。彼は「探していた人がいる」と語り出す。';
  e1.cliff = '蓮「その人の名前は——ミサキ、というんです」凍りつく美咲の顔でカット。';
  e1.script = [
    { id:uid(), type:'scene',  charId:'', text:'姉妹のマンション・リビング(朝)' },
    { id:uid(), type:'action', charId:'', text:'玲奈、真っ赤なドレスを美咲に投げつける。' },
    { id:uid(), type:'serif',  charId:c3.id, text:'アンタ、今日から私になりなさい' },
    { id:uid(), type:'serif',  charId:c1.id, text:'は……!? お見合いって、私が!?' },
    { id:uid(), type:'scene',  charId:'', text:'ホテル最上階・お見合い会場(昼)' },
    { id:uid(), type:'action', charId:'', text:'ぎこちなく座る美咲。グラスを倒す。蓮、無言でハンカチを差し出す。' },
    { id:uid(), type:'serif',  charId:c1.id, text:'す、すみません……! 私、こういう場所は初めてで' },
    { id:uid(), type:'serif',  charId:c2.id, text:'構いません。……実は僕には、ずっと探している人がいます' },
    { id:uid(), type:'action', charId:'', text:'蓮の左手首の傷跡がアップになる。美咲の目が見開かれる。' },
    { id:uid(), type:'serif',  charId:c2.id, text:'その人の名前は——ミサキ、というんです' },
  ];
  e1.retro = {
    keep:'冒頭2秒の「ドレスを投げつける」画で離脱が減った。セリフを字幕で大きく出したのも効いた。',
    problem:'中盤のお見合い準備シーンが長く、15秒付近に離脱の山。',
    try:'次話は中盤の説明を削ってセリフだけで状況を伝える。20秒以内に1回感情の起伏を入れる。',
  };
  e1.records = [
    { id:uid(), platform:'tiktok', date:'2026-07-01', views:125000, likes:8900, comments:210, saves:1500, shares:320, follows:480, completion:42, avgWatch:31, dropNote:'15秒付近(準備シーン)で離脱の山' },
    { id:uid(), platform:'reels',  date:'2026-07-01', views:31000,  likes:2100, comments:48,  saves:410,  shares:95,  follows:120, completion:38, avgWatch:28, dropNote:'' },
  ];

  const e2 = blankEpisode();
  e2.title = '契約結婚、始めます'; e2.status = '公開済';
  e2.hook = '蓮「僕と、契約結婚しませんか」いきなりプロポーズから開始。';
  e2.development = '身代わりがバレたら姉が破滅。断れない美咲に、蓮は「3ヶ月だけ婚約者のフリを」と条件を出す。';
  e2.twist = '契約書の最後の一行「ただし、恋をしたら違約金」。書いたのは蓮本人。';
  e2.cliff = '玲奈がSNSで「妹が婚約者の座を奪った」と匂わせ投稿。通知が鳴り止まない美咲のスマホ。';
  e2.script = [
    { id:uid(), type:'scene',  charId:'', text:'ホテルラウンジ(夜)' },
    { id:uid(), type:'serif',  charId:c2.id, text:'僕と、契約結婚しませんか' },
    { id:uid(), type:'serif',  charId:c1.id, text:'け、契約……!?' },
    { id:uid(), type:'action', charId:'', text:'差し出される契約書。最後の一行に「恋をしたら違約金」。' },
    { id:uid(), type:'serif',  charId:c1.id, text:'(なにそれ……こっちが聞きたいくらいなのに)' },
  ];
  e2.retro = {
    keep:'1秒目にプロポーズのセリフを持ってきた構成は完視聴率が上がった。',
    problem:'投稿時間を変えたら初速が鈍かった。',
    try:'公開時間を前回と同じ21時に固定してもう1本検証する。',
  };
  e2.records = [
    { id:uid(), platform:'tiktok', date:'2026-07-08', views:98000, likes:10200, comments:340, saves:2100, shares:410, follows:610, completion:55, avgWatch:38, dropNote:'離脱は終盤のみ。フック改善が効いた' },
    { id:uid(), platform:'reels',  date:'2026-07-08', views:45000, likes:3600, comments:88, saves:720, shares:150, follows:230, completion:47, avgWatch:33, dropNote:'' },
    { id:uid(), platform:'shorts', date:'2026-07-09', views:12000, likes:800, comments:25, saves:130, shares:40, follows:35, completion:41, avgWatch:30, dropNote:'ショートは伸びが遅い。3日目から再生増' },
  ];

  const e3 = blankEpisode();
  e3.title = '正体バレまであと3日'; e3.status = '執筆中';
  e3.hook = '玲奈の匂わせ投稿が10万リポスト。「この女、偽者です」のコメントで開始。';
  e3.development = '炎上対応のため2人で記者会見の練習。距離が近づく。';
  e3.twist = '蓮は実は最初から美咲が「身代わり」だと知っていた素振りを見せる。';
  e3.cliff = '蓮「君がミサキじゃないなら——なんで、あの日の傷の場所を知ってるの?」';

  s.episodes = [e1, e2, e3];
  return { version:1, settings:{ charsPerSec:6 }, series:[s] };
}

/* ---------- 保存 / 読み込み ---------- */
function detectLS(){
  try {
    localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    lsAvailable = true;
  } catch(e){ lsAvailable = false; }
}
let saveTimer = null;
function scheduleSave(){
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 500);
  updateSaveStatus();
}
function persist(){
  if (!lsAvailable) return;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    dirty = false;
  } catch(e){ lsAvailable = false; }
  updateSaveStatus();
}
function updateSaveStatus(){
  const dot = $('#saveDot'), msg = $('#saveMsg');
  if (lsAvailable){
    dot.className = 'save-dot on';
    msg.textContent = dirty ? '自動保存中…' : '自動保存:有効';
  } else {
    dot.className = 'save-dot off';
    msg.textContent = '自動保存不可 → JSON保存を';
  }
}
function loadState(){
  detectLS();
  if (lsAvailable){
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw){ state = JSON.parse(raw); return; }
    } catch(e){}
  }
  state = seedData();
}
function exportJSON(){
  persist();
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = URL.createObjectURL(blob);
  a.download = `台本スタジオ_バックアップ_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false;
  toast('JSONファイルを書き出しました');
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.series)) throw new Error('bad');
      state = data;
      ui.seriesId = state.series[0]?.id || null;
      ui.epId = null;
      ui.view = 'home';
      persist(); renderAll();
      toast('データを読み込みました');
    } catch(e){ toast('読み込み失敗:台本スタジオのJSONファイルを選んでください'); }
  };
  r.readAsText(file);
}

/* ---------- 取得ヘルパ ---------- */
const curSeries = () => state.series.find(s => s.id === ui.seriesId) || null;
function curEp(){
  const s = curSeries(); if (!s) return null;
  return s.episodes.find(e => e.id === ui.epId) || s.episodes[0] || null;
}
const epNo = (s, ep) => s.episodes.indexOf(ep) + 1;
const charOf = (s, id) => s.characters.find(c => c.id === id) || null;
const charColor = (s, id) => { const i = s.characters.findIndex(c=>c.id===id); return CHAR_COLORS[(i<0?0:i)%CHAR_COLORS.length]; };
const pfOf = id => PLATFORMS.find(p => p.id === id) || PLATFORMS[3];

/* ---------- 尺の推定 ---------- */
function lineSec(line){
  const len = (line.text||'').replace(/\s/g,'').length;
  if (!len && line.type !== 'scene') return 0;
  if (line.type === 'serif')  return Math.max(len / (state.settings.charsPerSec||6), 0.8);
  if (line.type === 'action') return Math.max(len / 12, 1);
  return 1; // scene: カット替わり
}
const scriptTotalSec = ep => (ep.script||[]).reduce((a,l)=>a+lineSec(l), 0);

/* ---------- 全体描画 ---------- */
function renderAll(){
  renderSidebar();
  const main = $('#main');
  const s = curSeries();
  if (ui.view !== 'home' && !s){ ui.view = 'home'; }
  switch(ui.view){
    case 'home':      main.innerHTML = vHome(); break;
    case 'plot':      main.innerHTML = vPlot(s); break;
    case 'chars':     main.innerHTML = vChars(s); break;
    case 'script':    main.innerHTML = vScript(s); afterScriptRender(); break;
    case 'analytics': main.innerHTML = vAnalytics(s); afterAnalyticsRender(s); break;
  }
  $$('.line-text textarea, .auto-ta').forEach(autosize);
}
function renderSidebar(){
  const selEl = $('#seriesSelect');
  selEl.innerHTML = state.series.length
    ? state.series.map(s=>`<option value="${s.id}"${sel(s.id,ui.seriesId)}>${esc(s.title)}</option>`).join('')
    : `<option value="">(作品がありません)</option>`;
  $$('#nav .nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === ui.view);
    b.disabled = b.dataset.view !== 'home' && !curSeries();
  });
  updateSaveStatus();
}
function autosize(ta){ ta.style.height='auto'; ta.style.height = (ta.scrollHeight+2)+'px'; }

/* ---------- 画面: 作品一覧 ---------- */
function seriesStats(s){
  const eps = s.episodes.length;
  const pub = s.episodes.filter(e=>e.status==='公開済').length;
  let views = 0, follows = 0;
  s.episodes.forEach(e => (e.records||[]).forEach(r => { views += +r.views||0; follows += +r.follows||0; }));
  return {eps, pub, views, follows};
}
function vHome(){
  const cards = state.series.map(s => {
    const st = seriesStats(s);
    return `
    <div class="card series-card" data-action="open-series" data-id="${s.id}">
      <div class="card-top">
        <div>
          <h3>${esc(s.title)}</h3>
          <div class="genre">${esc(s.genre||'ジャンル未設定')}</div>
        </div>
        <span class="badge st-${esc(s.status)}"><span class="dot"></span>${esc(s.status)}</span>
      </div>
      <div class="logline">${esc(s.logline||'ログライン未設定')}</div>
      <div class="meta">
        <span>全<b>${st.eps}</b>話</span>
        <span>公開<b>${st.pub}</b>話</span>
        <span>総再生<b>${fmtNum(st.views)}</b></span>
        <span>フォロワー<b>+${fmtNum(st.follows)}</b></span>
      </div>
      <div style="display:flex;gap:6px;margin-top:12px;">
        <button class="btn btn-sm" data-action="edit-series" data-id="${s.id}">✏️ 基本情報</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-action="del-series" data-id="${s.id}">削除</button>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="view-head">
    <div>
      <h1>作品一覧</h1>
      <div class="sub">縦型ショートドラマの企画・台本・分析をここで一元管理</div>
    </div>
    <div class="head-actions">
      <button class="btn btn-primary" data-action="new-series">＋ 新しい作品</button>
    </div>
  </div>
  ${state.series.length ? `<div class="grid grid-2">${cards}</div>` : `
    <div class="empty"><div class="big">🎬</div>まだ作品がありません。<br>「＋ 新しい作品」から最初のシリーズを作りましょう。</div>`}
  `;
}

/* ---------- 画面: プロット設計 ---------- */
function vPlot(s){
  const eps = s.episodes.map((e,i)=>`
  <div class="ep-card">
    <div class="ep-head">
      <span class="ep-no">第${i+1}話</span>
      <input type="text" class="ep-title" placeholder="タイトル未定" value="${esc(e.title)}" data-ef="title" data-ep="${e.id}">
      <select style="width:auto;font-size:11.5px;padding:4px 8px;" data-ef="status" data-ep="${e.id}">
        ${EP_STATUS.map(st=>`<option${sel(st,e.status)}>${st}</option>`).join('')}
      </select>
      <div class="ep-tools">

function afterScriptRender(){
  updateTimes();

function updateTimes(){
  const s = curSeries(), ep = curEp();
  if (!s || !ep) return;
  let t = 0, serifs = 0;
  (ep.script||[]).forEach(l => {
    const el = $(`[data-time="${l.id}"]`), se = $(`[data-sec="${l.id}"]`);
    const d = lineSec(l);
    if (el){
      el.textContent = t.toFixed(1)+'s';
      el.classList.toggle('inhook', t < 3);
    }
    if (se) se.textContent = d ? d.toFixed(1)+'s' : '';
    t += d;
    if (l.type==='serif') serifs++;
  });
  const target = +s.targetSec || 90;
  const fill = $('#tbFill'), now = $('#tbNow'), cnt = $('#tbCnt');
  if (fill){
    const pct = Math.min(t/target*100, 100);
    fill.style.width = pct+'%';
    fill.className = 'tb-fill' + (t>target ? ' over' : (t>target*0.85 ? ' near' : ''));
  }
  if (now) now.textContent = fmtSec(t) + (t>target ? '(超過!)' : '');
  if (cnt) cnt.textContent = `${(ep.script||[]).length}行 / セリフ${serifs}`;
  if (typeof renderHealthChip === 'function') renderHealthChip();
}

/* ---------- 台本テキスト化 ---------- */
function scriptToText(s, ep){
  const no = epNo(s, ep);
  let out = `${s.title} 第${no}話「${ep.title||'タイトル未定'}」\n`;
  out += `(推定尺:${fmtSec(scriptTotalSec(ep))} / 目標:${fmtSec(s.targetSec||90)})\n`;
  out += '─'.repeat(28)+'\n';
  (ep.script||[]).forEach(l=>{
    if (!l.text) return;
    if (l.type==='scene')  out += `\n○ ${l.text}\n`;
    else if (l.type==='action') out += `　${l.text}\n`;
    else { const c = charOf(s,l.charId); out += `${c?c.name:'??'}「${l.text}」\n`; }
  });
  return out;
}
function copyText(text, msg){
  const done = () => toast(msg||'コピーしました');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('コピーできませんでした'); }
  ta.remove();
}
function downloadText(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

  return out;
}
function vAnalytics(s){
  const recs = allRecords(s);
  const views = recs.reduce((a,x)=>a+(+x.r.views||0),0);

  const avgComp = comps.length ? comps.reduce((a,x)=>a+(+x.r.completion||0),0)/comps.length : null;
  const saveRate = views ? (saves/views*100) : null;

  const rows = recs.sort((a,b)=> a.no-b.no || String(a.r.date).localeCompare(String(b.r.date)))

          <textarea class="auto-ta" data-retro="problem" data-ep="${e.id}" placeholder="数字とセットで書くと次に効く">${esc(e.retro?.problem||'')}</textarea></div>
        <div class="retro-cell try"><label>🚀 Try — 次に試すこと</label>
          <textarea class="auto-ta" data-retro="try" data-ep="${e.id}" placeholder="次話で検証する仮説を1つに絞る">${esc(e.retro?.try||'')}</textarea></div>

  return `
  <div class="view-head">
    <div>
      <h1>分析・PDCA</h1>
      <div class="sub">${esc(s.title)} — 公開後の数字を記録 → 勝ちパターンを見つけて次話に反映</div>
    </div>

    <div class="kpi"><div class="k-label">フォロワー増</div><div class="k-val">+${fmtNum(follows)}</div><div class="k-sub">シリーズ累計</div></div>

function afterAnalyticsRender(s){

function latestRecord(ep, pfId){
  const rs = (ep.records||[]).filter(r=>r.platform===pfId);
  if (!rs.length) return null;
  return rs.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))[rs.length-1];
}
function drawChart(s){
  const wrap = $('#chartWrap'); if (!wrap) return;
  const metric = ui.metric || 'views';
  const mDef = METRICS.find(m=>m.id===metric);
  const eps = s.episodes;
  const pfs = PLATFORMS.filter(p => eps.some(e => (e.records||[]).some(r=>r.platform===p.id && r[metric]!=='' && r[metric]!=null)));
  const seriesData = pfs.map(p => ({
    pf: p,
    pts: eps.map((e,i)=>{
      const r = latestRecord(e, p.id);
      const v = r && r[metric]!=='' && r[metric]!=null ? +r[metric] : null;
      return v==null ? null : {x:i+1, y:v, ep:e};
    }).filter(Boolean),
  })).filter(sd => sd.pts.length);

  // 凡例
  $('#chartLegend').innerHTML = seriesData.map(sd =>
    `<span class="lg"><span class="sw" style="background:${sd.pf.color}"></span>${sd.pf.label}</span>`).join('');

  const W=720, H=250, padL=52, padR=16, padT=14, padB=30;
  const xs = eps.map((_,i)=>i+1);
  const maxY = Math.max(1, ...seriesData.flatMap(sd=>sd.pts.map(p=>p.y)));
  const niceMax = niceCeil(maxY);
  const xPos = x => xs.length===1 ? (padL+(W-padL-padR)/2) : padL + (x-1)/(xs.length-1)*(W-padL-padR);
  const yPos = y => padT + (1 - y/niceMax)*(H-padT-padB);

  let grid='', ticks='';
  for (let i=0;i<=4;i++){
    const v = niceMax*i/4, y = yPos(v);
    grid  += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2c2c2a" stroke-width="1"/>`;
    ticks += `<text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#898781">${metric==='completion'?v.toFixed(0)+'%':fmtNum(v)}</text>`;
  }
  let xlabels='';
  xs.forEach(x=>{
    xlabels += `<text x="${xPos(x)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#898781">第${x}話</text>`;
  });

  const hitPts = [];
  let paths='';
  seriesData.forEach(sd=>{
    const d = sd.pts.map((p,i)=>`${i?'L':'M'}${xPos(p.x).toFixed(1)},${yPos(p.y).toFixed(1)}`).join('');
    paths += `<path d="${d}" fill="none" stroke="${sd.pf.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    sd.pts.forEach(p=>{
      const cx=xPos(p.x), cy=yPos(p.y);
      paths += `<circle cx="${cx}" cy="${cy}" r="4" fill="${sd.pf.color}" stroke="#1a1a19" stroke-width="2"/>`;
      hitPts.push({cx, cy, pf:sd.pf, x:p.x, y:p.y});
    });
  });

  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;" id="chartSvg" role="img" aria-label="${mDef.label}の話数ごとの推移">
      ${grid}<line x1="${padL}" x2="${W-padR}" y1="${yPos(0)}" y2="${yPos(0)}" stroke="#383835" stroke-width="1"/>
      ${ticks}${xlabels}${paths}
    </svg>
    <div class="chart-tip" id="chartTip"></div>`;

  const svg = $('#chartSvg'), tip = $('#chartTip');
  svg.addEventListener('mousemove', ev=>{
    const rect = svg.getBoundingClientRect();
    const mx = (ev.clientX-rect.left)/rect.width*W;
    const my = (ev.clientY-rect.top)/rect.height*H;
    let best=null, bd=1e9;
    hitPts.forEach(p=>{ const d=(p.cx-mx)**2+(p.cy-my)**2; if(d<bd){bd=d;best=p;} });
    if (best && bd < 40**2){
      tip.style.display='block';
      const px = best.cx/W*rect.width, py = best.cy/H*rect.height;
      tip.innerHTML = `<span style="color:${best.pf.color}">●</span> ${best.pf.label} 第${best.x}話<br><b>${metric==='completion'?best.y+'%':fmtNum(best.y)}${mDef.unit==='秒'?'秒':''}</b> — ${mDef.label}`;
      tip.style.left = Math.min(px+12, rect.width-150)+'px';
      tip.style.top = (py-14)+'px';
    } else tip.style.display='none';
  });
  svg.addEventListener('mouseleave', ()=> tip.style.display='none');
}
function niceCeil(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const m = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return m*p;
}

/* ---------- AIプロンプト生成 ---------- */
function charBlock(s){
  if (!s.characters.length) return '(キャラクター未設定)';
  return s.characters.map(c=>`- ${c.name}(${c.role}${c.age?' / '+c.age:''}):${c.profile||''} 【口調】${c.tone||'未設定'}${c.relation?' 【関係】'+c.relation:''}`).join('\n');
}
function epListBlock(s){
  if (!s.episodes.length) return '(まだ話がありません)';
  return s.episodes.map((e,i)=>`第${i+1}話「${e.title||'未定'}」[${e.status}] フック:${e.hook||'-'} / 展開:${e.development||'-'} / 転:${e.twist||'-'} / 引き:${e.cliff||'-'}`).join('\n');
}
function analyticsBlock(s){
  const recs = allRecords(s);
  if (!recs.length) return '(実績データなし)';
  let out = recs.map(({no,r}) => {
    const pf = pfOf(r.platform);
    return `第${no}話 [${pf.label}] 再生${r.views||0} / いいね${r.likes||0} / 保存${r.saves||0} / シェア${r.shares||0} / フォロワー+${r.follows||0} / 完視聴率${r.completion||'-'}% / 平均視聴${r.avgWatch||'-'}秒${r.dropNote?' / 離脱メモ:'+r.dropNote:''}`;
  }).join('\n');
  const kpt = s.episodes.filter(e=>e.retro && (e.retro.keep||e.retro.problem||e.retro.try))
    .map((e)=>`第${epNo(s,e)}話の振り返り → Keep:${e.retro.keep||'-'} / Problem:${e.retro.problem||'-'} / Try:${e.retro.try||'-'}`).join('\n');
  return out + (kpt ? '\n\n【制作者の振り返り】\n'+kpt : '');
}
function seriesHeadBlock(s){
  return `作品名:${s.title}\nジャンル:${s.genre||'未設定'}\nログライン:${s.logline||'未設定'}\nターゲット:${s.audience||'未設定'}\n1話の目標尺:${s.targetSec||90}秒(縦型ショートドラマ)\n全体アーク:${s.arc||'未設定'}\n世界観:${s.world||'未設定'}`;
}
function buildPrompt(kind, epId){
  const s = curSeries(); if (!s) return '';
  const ep = epId ? s.episodes.find(e=>e.id===epId) : curEp();
  const head = `あなたは縦型ショートドラマ(TikTok/リール向け、1話${s.targetSec||90}秒前後)のプロ脚本家です。\n最初の2秒のフックとラストの引きを最重要視し、説明ではなくセリフと画で見せる脚本術を使ってください。\n\n【作品情報】\n${seriesHeadBlock(s)}\n\n【キャラクター】\n${charBlock(s)}\n`;
  if (kind==='plot'){
    return head + `\n【これまでの話数】\n${epListBlock(s)}\n\n【実績データ(参考)】\n${analyticsBlock(s)}\n\n【依頼】\n続きの話のプロット案を3パターン提案してください。各案は必ず次の4要素で構成:\n1. 冒頭フック(最初の0〜2秒の画とセリフ)\n2. 展開(20秒に1回の感情の起伏)\n3. 転・オチ(予想を裏切るポイント)\n4. ラストの引き(次話を見たくなるクリフハンガー)\nそれぞれ、なぜ完視聴率が上がると考えるかの理由も添えてください。`;
  }
  if (kind==='script'){
    const no = ep ? epNo(s,ep) : '?';
    return head + `\n【今回書いてほしい話】\n第${no}話「${ep?.title||'未定'}」\n冒頭フック:${ep?.hook||'未設定(あなたが提案してください)'}\n展開:${ep?.development||'未設定'}\n転・オチ:${ep?.twist||'未設定'}\nラストの引き:${ep?.cliff||'未設定'}\n\n【依頼】\nこの話の台本を書いてください。フォーマットは以下を厳守:\n○ シーン見出し(場所・時間)\n　ト書き(動き・画の説明。1行は短く)\nキャラ名「セリフ」\n\n条件:\n- 合計尺は${s.targetSec||90}秒以内(セリフは6文字=約1秒で計算)\n- 最初の3秒以内に冒頭フックのセリフか画を置く\n- 各キャラの口調設定を必ず守る\n- 説明ゼリフ禁止。状況は画とリアクションで伝える\n- ラストは「引き」のセリフ/画で終える`;
  }
  if (kind==='polish'){
    const no = ep ? epNo(s,ep) : '?';
    const cur = ep ? scriptToText(s, ep) : '(台本なし)';
    return head + `\n【現在の台本(第${no}話)】\n${cur}\n\n【依頼】\nこの台本のセリフをブラッシュアップしてください。\n- 各キャラの口調設定を守りつつ、より感情が動く言い回しに\n- 冗長なセリフは短く(縦型ドラマは1セリフ12文字前後がテンポ良い)\n- 冒頭3秒のフック力とラストの引きを特に強化\n- 変更点には理由を一言添えて、修正後の全文を同じフォーマットで出力`;
  }
  if (kind==='analyze'){
    return head + `\n【これまでの話数】\n${epListBlock(s)}\n\n【公開実績データ】\n${analyticsBlock(s)}\n\n【依頼】\nあなたはショート動画グロースの専門家でもあります。上記データを分析して:\n1. 数字から読み取れる「勝ちパターン」(何が完視聴率・フォロワー転換に効いているか)\n2. 最大の課題と、その原因仮説\n3. 次の1話で検証すべき改善アクション3つ(優先度順、具体的に)\n4. プラットフォームごとの伸び方の違いと、それぞれへの最適化案\nを提案してください。データが少ない部分は推測と明示した上で提案してください。`;
  }
  return '';
}
const AI_KINDS = [
  {id:'plot',    label:'📋 次話のプロット提案', needEp:false},
  {id:'script',  label:'📝 台本ドラフト作成',   needEp:true},

/* ---------- イベント ---------- */
function handleAction(ds, el){
  const s = curSeries();
  switch(ds.action){
    case 'nav': ui.view = ds.view; renderAll(); break;
    case 'modal-close': closeModal(); break;

    /* 作品 */
    case 'new-series': seriesModal(null); break;
    case 'edit-series': { const t = state.series.find(x=>x.id===ds.id); seriesModal(t); break; }
    case 'series-save': {
      const title = $('#mTitle').value.trim();
      if (!title){ toast('タイトルを入力してください'); return; }
      if (ds.id){
        const t = state.series.find(x=>x.id===ds.id);
        Object.assign(t, {title, genre:$('#mGenre').value, targetSec:+$('#mTarget').value||90, logline:$('#mLogline').value});
      } else {
        const ns = blankSeries(title);
        ns.genre = $('#mGenre').value; ns.targetSec = +$('#mTarget').value||90; ns.logline = $('#mLogline').value;
        state.series.push(ns);
        ui.seriesId = ns.id; ui.view = 'plot';
      }
      closeModal(); scheduleSave(); renderAll(); break;
    }
    case 'del-series': {
      const t = state.series.find(x=>x.id===ds.id);
      if (!confirm(`「${t.title}」を削除しますか?この操作は戻せません。`)) return;
      state.series = state.series.filter(x=>x.id!==ds.id);
      if (ui.seriesId===ds.id){ ui.seriesId = state.series[0]?.id||null; ui.epId=null; }
      scheduleSave(); renderAll(); break;
    }
    case 'open-series': ui.seriesId = ds.id; ui.epId = null; ui.view = 'plot'; renderAll(); break;

    /* 話 */
    case 'ep-add': { s.episodes.push(blankEpisode()); scheduleSave(); renderAll(); break; }
    case 'ep-del': {
      const e = s.episodes.find(x=>x.id===ds.ep);
      if (!confirm(`第${epNo(s,e)}話「${e.title||'タイトル未定'}」を削除しますか?`)) return;
      s.episodes = s.episodes.filter(x=>x.id!==ds.ep);
      if (ui.epId===ds.ep) ui.epId = null;
      scheduleSave(); renderAll(); break;
    }
    case 'ep-up': case 'ep-down': {
      const i = s.episodes.findIndex(x=>x.id===ds.ep);
      const j = ds.action==='ep-up' ? i-1 : i+1;
      if (j<0||j>=s.episodes.length) return;
      [s.episodes[i], s.episodes[j]] = [s.episodes[j], s.episodes[i]];
      scheduleSave(); renderAll(); break;
    }
    case 'goto-script': ui.epId = ds.ep; ui.view='script'; renderAll(); break;

    /* キャラ */
    case 'char-add': s.characters.push({id:uid(), name:'', role:'脇役', age:'', profile:'', tone:'', relation:''}); scheduleSave(); renderAll(); break;
    case 'char-del': {
      const c = charOf(s, ds.char);
      if (!confirm(`「${c.name||'(名前未設定)'}」を削除しますか?`)) return;
      s.characters = s.characters.filter(x=>x.id!==ds.char);
      scheduleSave(); renderAll(); break;
    }

    /* 台本行 */
    case 'line-add': {
      const ep = curEp(); if (!ep) return;
      const l = blankLine(ds.type);
      if (ds.type==='serif' && s.characters.length===1) l.charId = s.characters[0].id;
      ep.script.push(l);
      scheduleSave(); renderAll();
      const ta = $(`textarea[data-line="${l.id}"]`); ta?.focus();
      break;
    }
    case 'line-del': {
      const ep = curEp();
      ep.script = ep.script.filter(x=>x.id!==ds.line);
      scheduleSave(); renderAll(); break;
    }
    case 'line-up': case 'line-down': {
      const ep = curEp();
      const i = ep.script.findIndex(x=>x.id===ds.line);
      const j = ds.action==='line-up' ? i-1 : i+1;
      if (j<0||j>=ep.script.length) return;
      [ep.script[i], ep.script[j]] = [ep.script[j], ep.script[i]];
      scheduleSave(); renderAll(); break;
    }
    case 'copy-script': { const ep=curEp(); if(ep) copyText(scriptToText(s,ep), '台本をコピーしました'); break; }
    case 'dl-script': {
      const ep=curEp(); if(!ep) return;
      downloadText(`${s.title}_第${epNo(s,ep)}話.txt`, scriptToText(s,ep));
      toast('.txtファイルを保存しました'); break;
    }

    /* 実績 */
    case 'rec-add': recordModal(s, ui.epId, null); break;
    case 'rec-edit': recordModal(s, ds.ep, ds.rec); break;
    case 'rec-del': {
      const ep = s.episodes.find(x=>x.id===ds.ep);
      if (!confirm('この実績記録を削除しますか?')) return;
      ep.records = ep.records.filter(r=>r.id!==ds.rec);
      scheduleSave(); renderAll(); break;
    }
    case 'rec-save': {
      const epId = $('#rEp').value;
      const ep = s.episodes.find(x=>x.id===epId);
      const data = {
        platform:$('#rPf').value, date:$('#rDate').value,
        views:numOrEmpty('#rViews'), likes:numOrEmpty('#rLikes'), comments:numOrEmpty('#rComments'),
        saves:numOrEmpty('#rSaves'), shares:numOrEmpty('#rShares'), follows:numOrEmpty('#rFollows'),
        completion:numOrEmpty('#rCompletion'), avgWatch:numOrEmpty('#rAvgWatch'),
        dropNote:$('#rDropNote').value,
      };
      if (ds.rec){
        const oldEp = s.episodes.find(x=>x.id===ds.origep);
        const r = oldEp.records.find(x=>x.id===ds.rec);
        if (ds.origep!==epId){
          oldEp.records = oldEp.records.filter(x=>x.id!==ds.rec);
          ep.records.push(Object.assign(r, data));
        } else Object.assign(r, data);
      } else {
        ep.records.push(Object.assign({id:uid()}, data));
      }
      closeModal(); scheduleSave(); renderAll(); toast('実績を保存しました'); break;
    }

    /* AI */
    case 'ai': aiModal(ds.kind, ui.epId); break;
    case 'ai-copy': copyText($('#aiPrompt').value, '依頼文をコピーしました。AIに貼り付けてください'); break;
  }
}
function numOrEmpty(sl){ const v = $(sl).value; return v==='' ? '' : +v; }

function handleInput(e){
  const el = e.target;
  const s = curSeries();
  if (el.dataset.sf && s){
    s[el.dataset.sf] = el.dataset.sf==='targetSec' ? (+el.value||90) : el.value;
    if (el.dataset.sf==='title') renderSidebar();
    scheduleSave();
  } else if (el.dataset.ef && s){
    const ep = s.episodes.find(x=>x.id===el.dataset.ep);
    if (ep){ ep[el.dataset.ef] = el.value; scheduleSave(); }
  } else if (el.dataset.cf && s){
    const c = charOf(s, el.dataset.char);
    if (c){ c[el.dataset.cf] = el.value; scheduleSave(); }
  } else if (el.dataset.retro && s){
    const ep = s.episodes.find(x=>x.id===el.dataset.ep);
    if (ep){ ep.retro = ep.retro||{}; ep.retro[el.dataset.retro] = el.value; scheduleSave(); }
  } else if (el.dataset.lf && s){
    const ep = curEp();
    const l = ep?.script.find(x=>x.id===el.dataset.line);
    if (l){
      l[el.dataset.lf] = el.value;
      scheduleSave();
      if (el.dataset.lf==='type'){ renderAll(); const ta=$(`textarea[data-line="${l.id}"]`); ta?.focus(); return; }
      if (el.dataset.lf==='charId'){ el.style.borderLeft = `3px solid ${charColor(s, l.charId)}`; }
      updateTimes();
    }
  }
  if (el.tagName==='TEXTAREA') autosize(el);
}

/* ---------- 横断検索 ---------- */
function snip(text, i, len){
  const start = Math.max(0, i-18), end = Math.min(text.length, i+len+46);
  return (start>0?'…':'') + esc(text.slice(start,i)) + '<mark>' + esc(text.slice(i,i+len)) + '</mark>' + esc(text.slice(i+len,end)) + (end<text.length?'…':'');
}
function searchAll(q){
  const res = [], ql = q.toLowerCase();
  const add = (type, text, go, label) => {
    if (!text || res.length >= 40) return;
    const i = String(text).toLowerCase().indexOf(ql);
    if (i < 0) return;
    res.push(Object.assign({type, label, snippet: snip(String(text), i, q.length)}, go));
  };
  state.series.forEach(sr => {
    add('作品', [sr.title, sr.genre, sr.logline, sr.arc, sr.world].filter(Boolean).join(' / '), {seriesId:sr.id, view:'plot'}, sr.title);
    sr.characters.forEach(c =>
      add('キャラ', [c.name, c.profile, c.tone, c.relation].filter(Boolean).join(' / '), {seriesId:sr.id, view:'chars'}, `${sr.title} / ${c.name||'(名前未設定)'}`));
    sr.episodes.forEach((e,i) => {
      const lbl = `${sr.title} / 第${i+1}話 ${e.title||''}`;
      add('話タイトル', e.title, {seriesId:sr.id, view:'plot', epId:e.id}, lbl);
      add('プロット', [e.hook, e.development, e.twist, e.cliff].filter(Boolean).join(' / '), {seriesId:sr.id, view:'plot', epId:e.id}, lbl);
      (e.script||[]).forEach(l => {
        const tname = l.type==='serif' ? 'セリフ' : l.type==='action' ? 'ト書き' : 'シーン';
        add(tname, l.text, {seriesId:sr.id, view:'script', epId:e.id, lineId:l.id}, lbl);
      });
      add('振り返り', [e.retro?.keep, e.retro?.problem, e.retro?.try].filter(Boolean).join(' / '), {seriesId:sr.id, view:'analytics', epId:e.id}, lbl);
    });
  });
  return res;
}
function renderSearchPop(q){
  const pop = $('#searchPop');
  if (!q || !q.trim()){ pop.style.display='none'; pop.innerHTML=''; return; }
  const res = searchAll(q.trim());
  pop.style.display = 'block';
  pop.innerHTML = res.length ? res.map(r => `
    <button class="sr-item" data-action="search-go" data-series="${r.seriesId}" data-goview="${r.view}" data-ep="${r.epId||''}" data-line="${r.lineId||''}">
      <span class="sr-meta"><span class="sr-type">${r.type}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.label)}</span></span>
      <span>${r.snippet}</span>
    </button>`).join('')
    : `<div class="sr-empty">「${esc(q.trim())}」は見つかりませんでした</div>`;
}
function flashLine(lineId){

/* ---------- 台本ヘルスチェック ---------- */
function healthCheck(s, ep){
  const all = ep.script || [];
  const contentLines = all.filter(l => (l.text||'').trim());
  if (!contentLines.length) return {score:null, items:[{st:'warn', title:'台本がまだありません', detail:'行を書き始めると、フック・尺・テンポなどを自動で採点します。'}]};
  const items = []; let score = 0;
  const add = (st, pts, max, title, detail, lineId) => { score += pts; items.push({st, pts, max, title, detail, lineId}); };

  // 1) 冒頭フック(25点)
  let t = 0, hookSerif = false, hookAny = false;
  for (const l of all){
    if (t < 3 && (l.text||'').trim()){ hookAny = true; if (l.type==='serif') hookSerif = true; }
    t += lineSec(l);
  }
  if (hookSerif) add('pass',25,25,'冒頭フック','最初の3秒以内にセリフがあります。掴みはOK。');
  else if (hookAny) add('warn',12,25,'冒頭フック','最初の3秒はト書きのみです。強烈な「画」なら成立しますが、フックのセリフを1行目に置くとさらに離脱が減ります。');
  else add('fail',0,25,'冒頭フック','最初の3秒に中身がありません。冒頭にフックのセリフか画を置きましょう。');

  // 2) ラストの引き(20点)
  const last = contentLines[contentLines.length-1];
  const lastSerif = last && last.type==='serif';
  if ((ep.cliff||'').trim() && lastSerif) add('pass',20,20,'ラストの引き','引きが設計され、最後がセリフで終わっています。');
  else if ((ep.cliff||'').trim()) add('warn',10,20,'ラストの引き','引きは設計済みですが、最後の行がセリフではありません。引きのセリフで終えると次話への誘導が強まります。', last?last.id:'');
  else if (lastSerif) add('warn',10,20,'ラストの引き','最後はセリフで終わっていますが、設計図の「引き」欄が空です。狙いを言語化しておくとブレません。');
  else add('fail',0,20,'ラストの引き','引きが未設計です。次話を見たくなるクリフハンガーで終えましょう。');

  // 3) 尺(15点)
  const total = scriptTotalSec(ep), target = +s.targetSec || 90;
  if (total > target*1.15) add('fail',0,15,'尺',`推定${fmtSec(total)}で目標(${fmtSec(target)})を${Math.round(total-target)}秒超過。丸ごと削れるシーンがないか見直しを。`);
  else if (total > target) add('warn',7,15,'尺',`目標を${Math.round(total-target)}秒だけ超過。長いセリフを1〜2行削れば収まります。`);
  else if (total < target*0.5) add('warn',7,15,'尺',`推定${fmtSec(total)}とかなり短め(目標${fmtSec(target)})。書きかけならOK。`);
  else add('pass',15,15,'尺',`推定${fmtSec(total)} / 目標${fmtSec(target)}。良い範囲です。`);

  // 4) セリフのテンポ(15点)
  const serifs = contentLines.filter(l => l.type==='serif');
  if (serifs.length){
    const avg = serifs.reduce((a,l)=>a+l.text.replace(/\s/g,'').length,0)/serifs.length;
    const longest = serifs.reduce((a,b)=> (b.text.length>a.text.length?b:a));
    if (avg <= 16) add('pass',15,15,'セリフのテンポ',`平均${avg.toFixed(0)}文字/セリフ。縦型に最適な短さです。`);
    else if (avg <= 22) add('warn',7,15,'セリフのテンポ',`平均${avg.toFixed(0)}文字/セリフとやや長め。1セリフ12〜16文字がテンポの目安。まず最長のセリフから割るか削るのが早いです。`, longest.id);
    else add('fail',0,15,'セリフのテンポ',`平均${avg.toFixed(0)}文字/セリフ。長ゼリフはテンポを殺します。2つに割るかカットを。`, longest.id);
  } else add('fail',0,15,'セリフのテンポ','セリフがありません。縦型ドラマはセリフ主導が基本です。');

  // 5) ト書きの量(10点)
  const aChars = contentLines.filter(l=>l.type==='action').reduce((a,l)=>a+l.text.length,0);
  const allChars = contentLines.reduce((a,l)=>a+l.text.length,0) || 1;
  const ratio = aChars/allChars;
  if (ratio <= 0.35) add('pass',10,10,'ト書きの量',`ト書き比率${Math.round(ratio*100)}%。セリフ主導の良いバランス。`);
  else if (ratio <= 0.5) add('warn',5,10,'ト書きの量',`ト書き比率${Math.round(ratio*100)}%とやや多め。説明をセリフとリアクションに置き換えられないか検討を。`);
  else add('fail',0,10,'ト書きの量',`ト書き比率${Math.round(ratio*100)}%。文章で説明しすぎかも。「画で見せる+一言」に。`);

  // 6) 話者の設定(10点)
  const noChar = serifs.filter(l => !l.charId);
  if (!noChar.length) add('pass',10,10,'話者の設定','すべてのセリフに話者が設定されています。');
  else add('fail',0,10,'話者の設定',`話者未設定のセリフが${noChar.length}行あります。プレビューやAI依頼の精度にも影響します。`, noChar[0].id);

  // 7) シーン見出し(5点)
  if (all.some(l => l.type==='scene' && (l.text||'').trim())) add('pass',5,5,'シーン見出し','場所・時間が明示されています。撮影台本として使えます。');
  else add('warn',2,5,'シーン見出し','シーン見出しがありません。撮影時に迷わないよう最低1つ入れましょう。');

  return {score: Math.round(score), items};
}
function scoreColor(sc){ return sc>=80 ? '#7fd07f' : sc>=50 ? '#eda100' : '#f0908f'; }
function renderHealthChip(){

    ${h.items.map(it => `
      <div class="hl-item">
        <span class="st">${icon(it.st)}</span>

          <div class="tt">${esc(it.title)}${it.max?`<span class="pts">${it.pts}/${it.max}点</span>`:''}</div>
          <div class="dd">${esc(it.detail)}</div>
        </div>
        ${it.lineId ? `<button class="btn btn-sm jump" data-action="health-jump" data-line="${it.lineId}">該当行へ</button>` : ''}
      </div>`).join('')}
    <div class="hint" style="margin-top:10px;">採点は目安です(セリフ${state.settings.charsPerSec}文字=約1秒で換算)。数字より「面白いか」が最優先。</div>
    <div class="modal-foot"><button class="btn" data-action="modal-close">閉じる</button></div>`);
}

    <div class="modal-foot"><button class="btn" data-action="modal-close">閉じる</button></div>`);
  $('#pvSpeed').addEventListener('change', e => { pvSpeed = +e.target.value || 1; });
  pvRender();
  pvToggle(); // 自動再生
}
function pvRender(){
  const prog = $('#pvProg'); if (!prog) return;
  prog.style.width = Math.min(pvT/pvTotal*100, 100) + '%';
  const tEl = $('#pvTime'); if (tEl) tEl.textContent = pvT.toFixed(1) + 's / ' + Math.round(pvTotal) + 's';
  const hb = $('#pvHook'); if (hb) hb.style.display = pvT < 3 ? 'block' : 'none';
  let idx = pvSchedule.findIndex(it => pvT >= it.start && pvT < it.start + it.dur);
  if (pvT >= pvTotal) idx = pvSchedule.length;
  if (idx === pvIdx) return;
  pvIdx = idx;
  const s = curSeries(), ep = curEp();
  const sc = pvSchedule.filter(it => it.l.type==='scene' && it.start <= pvT+0.01).pop();
  const scEl = $('#pvScene'); if (scEl) scEl.textContent = sc ? '◯ ' + sc.l.text : '';
  const body = $('#pvBody'); if (!body) return;
  if (idx >= pvSchedule.length){
    body.innerHTML = `<div class="pv-action" style="top:32%;">🎬 END</div>
      <div class="pv-serif"><div class="pv-name" style="color:#e87ba4;border:1px solid rgba(232,123,164,.4);">引き</div>
      <div class="pv-text" style="font-size:13px;font-weight:600;color:#e8cdd8;">${esc(ep.cliff||'(引き未設定——ここが次話への命綱です)')}</div></div>`;
    pvStop();
    const b = $('#pvPlayBtn'); if (b) b.innerHTML = '▶ もう一度';
    return;
  }
  const it = pvSchedule[idx];
  if (!it){ body.innerHTML = ''; return; }
  const l = it.l;
  if (l.type === 'serif'){
    const c = charOf(s, l.charId);
    const col = charColor(s, l.charId);
    body.innerHTML = `<div class="pv-serif"><div class="pv-name" style="color:${col};border:1px solid ${col}66;">${esc(c?c.name:'??')}</div><div class="pv-text">${esc(l.text)}</div></div>`;
  } else if (l.type === 'action'){
    body.innerHTML = `<div class="pv-action">${esc(l.text)}</div>`;
  } else {
    body.innerHTML = `<div class="pv-action" style="letter-spacing:.12em;color:#9fb4d4;">◯ ${esc(l.text)}</div>`;
  }
}
function pvTick(){ pvT += 0.05 * pvSpeed; pvRender(); }
function pvToggle(){
  const b = $('#pvPlayBtn');
  if (pvPlaying){
    pvStop();
    if (b) b.innerHTML = '▶ 再生';
  } else {
    if (pvT >= pvTotal){ pvT = 0; pvIdx = -2; }
    pvPlaying = true;
    pvTimer = setInterval(pvTick, 50);
    if (b) b.innerHTML = '⏸ 一時停止';
  }
}
function pvStop(){ pvPlaying = false; if (pvTimer){ clearInterval(pvTimer); pvTimer = null; } }
function pvRestart(){
  pvStop(); pvT = 0; pvIdx = -2; pvRender();
  const b = $('#pvPlayBtn'); if (b) b.innerHTML = '▶ 再生';
}

/* ---------- モーダルを閉じたらプレビュー停止 ---------- */
const __origCloseModal = closeModal;
closeModal = function(){ pvStop(); __origCloseModal(); };

/* ---------- 追加アクション ---------- */
function handleAction2(ds){
  switch(ds.action){
    case 'search-go': {
      ui.seriesId = ds.series; ui.view = ds.goview; ui.epId = ds.ep || null;
      $('#searchPop').style.display = 'none';
      $('#globalSearch').value = '';
      renderAll();
      if (ds.line) flashLine(ds.line);
      break;
    }
    case 'health-open': healthModal(); break;
    case 'health-jump': closeModal(); flashLine(ds.line); break;
    case 'tpl-open': tplModal(); break;
    case 'tpl-use': {
      const s = curSeries(); if (!s) return;
      const t = EP_TEMPLATES.find(x => x.id === ds.tpl); if (!t) return;
      const e = blankEpisode();
      e.hook = t.hook; e.development = t.development; e.twist = t.twist; e.cliff = t.cliff;
      s.episodes.push(e);
      closeModal(); scheduleSave();
      ui.view = 'plot'; renderAll();
      toast(`「${t.name}」の型を第${s.episodes.length}話に流し込みました`);
      setTimeout(() => { const cards = $$('.ep-card'); cards[cards.length-1]?.scrollIntoView({behavior:'smooth', block:'center'}); }, 90);
      break;
    }
    case 'preview-open': previewModal(); break;
    case 'pv-play': pvToggle(); break;
    case 'pv-restart': pvRestart(); break;
  }
}

/* ---------- 追加イベント配線 ---------- */
(function(){
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (b) handleAction2(b.dataset);
  });
  const inp = $('#globalSearch');
  let tm = null;
  inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => renderSearchPop(inp.value), 180); });
  inp.addEventListener('focus', () => { if (inp.value.trim()) renderSearchPop(inp.value); });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap') && !e.target.closest('#searchPop')) $('#searchPop').style.display = 'none';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('#searchPop').style.display = 'none';
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); inp.focus(); inp.select(); }
  });
  // 初期表示にヘルスチップを反映
  renderHealthChip();
  // PWA: サービスワーカー登録(https/localhost配信時のみ)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
