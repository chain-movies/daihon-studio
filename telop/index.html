<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a19">
<title>テロップメーカー｜テレビ番組風テロップを透過PNGで書き出し</title>
<script src="designs.js"></script>
<script>
  // Google Fonts（designs.js の FONTS から生成）
  (function () { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = TelopDesigns.googleFontsHref(); document.head.appendChild(l); })();
</script>
<script src="renderer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#232322; --surface3:#2b2b29;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --line:#2c2c2a;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16); --warn:#fab219; --radius:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:13.5px;line-height:1.6}
#app{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header .logo{display:flex;align-items:center;gap:9px;font-weight:700}
header .logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3987e5,#9085e9);display:flex;align-items:center;justify-content:center;font-size:14px}
header .sp{flex:1}
header .demo{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}
.seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--ink2);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
.seg button.on{background:var(--accent-soft);color:#a8ccf5;font-weight:600}
aside{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px}
aside.right{border-right:none;border-left:1px solid var(--line)}
.label{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin:12px 0 6px}
.label:first-child{margin-top:0}
select,input[type=text],textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.row .v{width:44px;text-align:right;color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;width:100%}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.designs{display:flex;flex-direction:column;gap:6px}
.dcard{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:var(--surface2)}
.dcard:hover{border-color:var(--line)}
.dcard.on{border-color:var(--accent);background:var(--accent-soft)}
.dcard canvas{width:100%;border-radius:6px;background:#3a3f4a;display:block}
.dcard .n{font-size:12px;display:flex;justify-content:space-between}
.dcard .n small{color:var(--muted)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;overflow:hidden;position:relative}
#stage{position:relative;max-width:100%;max-height:calc(100vh - 140px);box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:6px;overflow:hidden}
#stage canvas{display:block;max-width:100%;max-height:calc(100vh - 140px);width:auto;height:auto}
#stage.checker{background:repeating-conic-gradient(#3b3b3b 0 25%,#2a2a2a 0 50%) 0 0/24px 24px}
#stage.dark{background:#111}#stage.light{background:#e9e9e9}
#stage.img{background:#111 center/cover no-repeat}
.hint{color:var(--muted);font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:12px}
.sw.on{border-color:var(--accent);color:#a8ccf5;background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--accent)}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s}
.toast.show{opacity:1}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:52px auto auto auto;height:auto}aside{max-height:280px}main{min-height:300px}#stage{max-height:none}#stage canvas{max-height:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="mark">T</span><span>テロップメーカー</span><span style="color:var(--muted);font-weight:400;font-size:11.5px" id="packName"></span></div>
    <div class="sp"></div>
    <span class="demo" id="demoBadge" hidden>デモ版：書き出しに SAMPLE 透かし</span>
    <a class="demo" id="shopLink" href="../shop/" style="text-decoration:none;color:var(--ink);border-color:var(--line)" hidden>製品版・素材集はこちら →</a>
    <div class="seg" id="aspect"><button data-v="169" class="on">16:9 横</button><button data-v="916">9:16 縦</button></div>
    <div class="seg" id="bgsel"><button data-v="checker" class="on">透過</button><button data-v="dark">黒</button><button data-v="light">白</button><button data-v="img">画像…</button></div>
    <input type="file" id="bgfile" accept="image/*" hidden>
  </header>

  <aside>
    <div class="label">ジャンル</div>
    <select id="cat"></select>
    <div class="label">デザイン</div>
    <div class="designs" id="designs"></div>
  </aside>

  <main>
    <div id="stage" class="checker"><canvas id="preview"></canvas></div>
    <div class="hint">プレビュー：市松模様は透明部分です。書き出しは透過PNG（背景なし）。</div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="right">
    <div class="label">テキスト（改行で2行）</div>
    <textarea id="text"></textarea>
    <div id="subWrap"><div class="label">サブテキスト（肩書き・見出し）</div><input type="text" id="sub"></div>
    <div id="tagWrap"><div class="label">タグ文字（速報・POINT 1・① など）</div><input type="text" id="tag"></div>
    <div class="label">カラー</div>
    <div class="swatches" id="variants"></div>
    <div class="label">大きさ</div>
    <div class="row"><input type="range" id="scale" min="40" max="160" value="100"><span class="v" id="scaleV">100%</span></div>
    <div class="label">位置（上下）</div>
    <div class="row"><input type="range" id="offY" min="-900" max="200" value="0"><span class="v" id="offYV">0</span></div>
    <div class="label">位置（左右）</div>
    <div class="row"><input type="range" id="offX" min="-800" max="800" value="0"><span class="v" id="offXV">0</span></div>
    <div style="margin-top:10px"><label class="check"><input type="checkbox" id="plateOnly"> 文字なし（帯・ボックスのみ）</label></div>
    <hr>
    <button class="btn primary" id="dl">⬇ PNG を書き出し</button>
    <div class="hint" style="margin-top:6px">1920×1080 / 1080×1920 の透過PNG</div>
    <hr>
    <div class="label">台本を一括書き出し（1行＝1枚）</div>
    <textarea id="batch" placeholder="ここに台本を貼り付け&#10;1行ごとに同じデザインでPNGを作ります&#10;サブテキストは「｜」で区切る（例：山田 太郎｜代表取締役）"></textarea>
    <button class="btn" id="dlBatch" style="margin-top:8px">📦 ZIP で一括書き出し</button>
    <hr>
    <button class="btn" id="recipe">📋 Premiere 再現レシピをコピー</button>
    <div class="hint" style="margin-top:8px">© Chain-Movies. フォントは Google Fonts（オープンライセンス）。</div>
  </aside>
</div>

<script>
(function () {
  const DEMO = /* @DEMO */ true; /* @DEMO */
  const R = TelopRenderer, D = TelopDesigns;
  const $ = (s) => document.querySelector(s);
  const state = { design: D.DESIGNS[0].id, variant: 0, text: '', sub: '', tag: '', scale: 100, offX: 0, offY: 0, plateOnly: false, aspect: '169', bg: 'checker' };
  try { Object.assign(state, JSON.parse(localStorage.getItem('telopmaker') || '{}')); } catch (e) {}
  if (!D.DESIGNS.find((d) => d.id === state.design)) state.design = D.DESIGNS[0].id;
  const packs = [...new Set(D.DESIGNS.map((d) => d.pack))];
  $('#packName').textContent = packs.map((p) => (D.PACKS[p] || {}).short || p).join(' / ');
  if (DEMO) { $('#demoBadge').hidden = false; const sl = $('#shopLink'); if (sl) sl.hidden = false; }

  const cur = () => D.DESIGNS.find((d) => d.id === state.design);
  const save = () => { try { localStorage.setItem('telopmaker', JSON.stringify(state)); } catch (e) {} };
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); };
  const dims = () => state.aspect === '916' ? [1080, 1920] : [1920, 1080];

  /* ---- カテゴリ & デザイン一覧 ---- */
  const cats = ['すべて', ...new Set(D.DESIGNS.map((d) => d.category))];
  $('#cat').innerHTML = cats.map((c) => `<option>${c}</option>`).join('');
  const thumbCache = {};
  async function buildList() {
    const c = $('#cat').value;
    const list = D.DESIGNS.filter((d) => c === 'すべて' || d.category === c);
    const wrap = $('#designs'); wrap.innerHTML = '';
    for (const d of list) {
      const el = document.createElement('div'); el.className = 'dcard' + (d.id === state.design ? ' on' : '');
      el.innerHTML = `<canvas width="384" height="216"></canvas><div class="n"><span>${d.name}</span><small>${(d.variants || []).length}色</small></div>`;
      el.onclick = () => { state.design = d.id; state.variant = 0; state.text = ''; state.sub = ''; state.tag = ''; syncInputs(); buildList(); draw(); };
      wrap.appendChild(el);
      drawThumb(d, el.querySelector('canvas'));
    }
  }
  async function drawThumb(d, c) {
    if (!thumbCache[d.id]) {
      const off = document.createElement('canvas');
      await R.ensureFonts(R.resolve(d, 0), [d.sample, d.sampleSub || '']);
      R.render(off, d, { width: 1920, height: 1080, variant: 0 });
      const b = R.contentBounds(off, 40) || { x: 0, y: 0, w: 1920, h: 1080 };
      thumbCache[d.id] = { off, b };
    }
    const { off, b } = thumbCache[d.id];
    const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
    const s = Math.min(c.width / b.w, c.height / b.h, 1);
    ctx.drawImage(off, b.x, b.y, b.w, b.h, (c.width - b.w * s) / 2, (c.height - b.h * s) / 2, b.w * s, b.h * s);
  }

  /* ---- 入力同期 ---- */
  function syncInputs() {
    const d = cur();
    $('#text').value = state.text || d.sample || '';
    $('#sub').value = state.sub || d.sampleSub || '';
    $('#subWrap').style.display = d.sub ? '' : 'none';
    const rt = R.resolve(d, state.variant).tag; $('#tagWrap').style.display = d.tag ? '' : 'none'; $('#tag').value = state.tag || (rt ? rt.text : '');
    $('#scale').value = state.scale; $('#scaleV').textContent = state.scale + '%';
    $('#offY').value = state.offY; $('#offYV').textContent = state.offY;
    $('#offX').value = state.offX; $('#offXV').textContent = state.offX;
    $('#plateOnly').checked = state.plateOnly;
    const vs = d.variants || [];
    $('#variants').innerHTML = vs.map((v, i) => `<span class="sw${i === state.variant ? ' on' : ''}" data-i="${i}">${v.name}</span>`).join('') || '<span class="hint">—</span>';
    $('#variants').querySelectorAll('.sw').forEach((s) => s.onclick = () => { state.variant = +s.dataset.i; state.tag = ''; syncInputs(); draw(); });
    document.querySelectorAll('#aspect button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.aspect));
    document.querySelectorAll('#bgsel button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.bg));
    $('#stage').className = state.bg;
  }

  /* ---- 描画 ---- */
  let drawing = false, queued = false;
  async function draw() {
    if (drawing) { queued = true; return; }
    drawing = true;
    try {
      const d = cur(); const [W, H] = dims();
      const text = $('#text').value, sub = $('#sub').value;
      await R.ensureFonts(R.resolve(d, state.variant), [text, sub]);
      R.render($('#preview'), d, { width: W, height: H, variant: state.variant, text, sub, tagText: d.tag ? $('#tag').value : undefined, scale: state.scale / 100, offsetX: state.offX, offsetY: state.offY, plateOnly: state.plateOnly });
    } finally { drawing = false; if (queued) { queued = false; draw(); } }
  }

  /* ---- 書き出し ---- */
  function watermark(c) {
    if (!DEMO) return;
    const ctx = c.getContext('2d'); ctx.save();
    ctx.font = '700 28px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4; ctx.textAlign = 'right';
    ctx.strokeText('SAMPLE - telop maker', c.width - 24, c.height - 24); ctx.fillText('SAMPLE - telop maker', c.width - 24, c.height - 24); ctx.restore();
  }
  async function renderTo(text, sub) {
    const d = cur(); const [W, H] = dims(); const c = document.createElement('canvas');
    await R.ensureFonts(R.resolve(d, state.variant), [text, sub]);
    R.render(c, d, { width: W, height: H, variant: state.variant, text, sub, tagText: d.tag ? $('#tag').value : undefined, scale: state.scale / 100, offsetX: state.offX, offsetY: state.offY, plateOnly: state.plateOnly });
    watermark(c);
    return c;
  }
  const blobOf = (c) => new Promise((res) => c.toBlob(res, 'image/png'));
  const fname = (t) => (t || 'telop').replace(/\n/g, ' ').replace(/[\\/:*?"<>|]/g, '').slice(0, 24);
  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };

  $('#dl').onclick = async () => {
    const c = await renderTo($('#text').value, $('#sub').value);
    download(await blobOf(c), `${cur().name}_${fname($('#text').value)}.png`);
    toast('PNG を書き出しました');
  };
  $('#dlBatch').onclick = async () => {
    let lines = $('#batch').value.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return toast('台本が空です');
    if (DEMO && lines.length > 3) { lines = lines.slice(0, 3); toast('デモ版は3行までです'); }
    const zip = new JSZip(); const btn = $('#dlBatch'); btn.disabled = true;
    for (let i = 0; i < lines.length; i++) {
      const [t, s] = lines[i].split(/[｜|]/);
      btn.textContent = `書き出し中 ${i + 1}/${lines.length}`;
      const c = await renderTo(t.replace(/\\n/g, '\n'), s || '');
      zip.file(`${String(i + 1).padStart(3, '0')}_${fname(t)}.png`, await blobOf(c));
    }
    zip.file('list.txt', lines.map((l, i) => `${String(i + 1).padStart(3, '0')}\t${l}`).join('\n'));
    download(await zip.generateAsync({ type: 'blob' }), `${cur().name}_一括${lines.length}枚.zip`);
    btn.disabled = false; btn.textContent = '📦 ZIP で一括書き出し'; toast(`${lines.length}枚を ZIP にまとめました`);
  };
  $('#recipe').onclick = async () => {
    const r = R.recipe(cur(), state.variant);
    try { await navigator.clipboard.writeText(r); toast('レシピをコピーしました'); } catch (e) { prompt('レシピ', r); }
  };

  /* ---- イベント ---- */
  $('#cat').onchange = buildList;
  $('#text').oninput = () => { state.text = $('#text').value; save(); draw(); };
  $('#sub').oninput = () => { state.sub = $('#sub').value; save(); draw(); };
  $('#tag').oninput = () => { state.tag = $('#tag').value; save(); draw(); };
  $('#scale').oninput = (e) => { state.scale = +e.target.value; $('#scaleV').textContent = state.scale + '%'; save(); draw(); };
  $('#offY').oninput = (e) => { state.offY = +e.target.value; $('#offYV').textContent = state.offY; save(); draw(); };
  $('#offX').oninput = (e) => { state.offX = +e.target.value; $('#offXV').textContent = state.offX; save(); draw(); };
  $('#plateOnly').onchange = (e) => { state.plateOnly = e.target.checked; save(); draw(); };
  document.querySelectorAll('#aspect button').forEach((b) => b.onclick = () => { state.aspect = b.dataset.v; syncInputs(); save(); draw(); });
  document.querySelectorAll('#bgsel button').forEach((b) => b.onclick = () => {
    if (b.dataset.v === 'img') { $('#bgfile').click(); return; }
    state.bg = b.dataset.v; $('#stage').style.backgroundImage = ''; syncInputs(); save();
  });
  $('#bgfile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f); state.bg = 'img'; syncInputs(); $('#stage').style.backgroundImage = `url(${url})`;
  };
  window.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); $('#dl').click(); } });

  syncInputs(); buildList(); draw();
})();
</script>
</body>
</html>
