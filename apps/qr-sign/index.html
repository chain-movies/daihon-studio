<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR 付き案内板メーカー｜Wi-Fi・予約・メニュー・SNS の案内を A4／A5 に</title>
<meta name="description" content="見出し・ひとこと・URL（または Wi-Fi 情報）を入れるだけで、QR コード付きの店頭案内板を A4 1 枚／A5 2 面で印刷。Wi-Fi はパスワードを入れると接続用 QR を自動生成。色 6 種、PNG 書き出し、ブラウザ内だけで完結。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0d0d0d;--surface:#1a1a19;--surface2:#232322;--surface3:#2b2b29;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--accent:#e5484d;--warn:#fab219;--ok:#3fb950;--blue:#3987e5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:13.5px;line-height:1.6}
#app{display:grid;grid-template-columns:1fr 390px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header .logo{display:flex;align-items:center;gap:9px;font-weight:700}
header .logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#111,#3987e5);display:flex;align-items:center;justify-content:center;font-size:14px}
header .sp{flex:1}
header a{font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none}
header .demo{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}
main{overflow:auto;padding:16px;background:#2a2a28}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:12px}
h3{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px;letter-spacing:.04em}
label{display:block;font-size:12px;color:var(--ink2);margin:8px 0 2px}
input[type=text],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
textarea{resize:vertical;min-height:50px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;width:100%;margin-top:8px}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.sm{width:auto;padding:3px 9px;font-size:12px;margin:0}
.sign{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface2)}
.sign .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sign .h .sp{flex:1}
.sign input,.sign select,.sign textarea{margin-top:4px}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.warn{font-size:11.5px;color:var(--warn);margin-top:6px}
/* ---- pages ---- */
.page{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;color:#1b1b1b;box-shadow:0 20px 60px rgba(0,0,0,.5);page-break-after:always;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;display:grid}
.page.a4{grid-template-rows:1fr}
.page.a5{grid-template-rows:1fr 1fr}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14mm;position:relative;border:0.3mm dashed #ccc}
.card .ic{font-size:14pt;font-weight:700;color:#fff;background:var(--c);padding:1.5mm 6mm;border-radius:3mm;letter-spacing:.1em}
.card .ttl{font-size:30pt;font-weight:900;color:var(--c);margin-top:5mm;line-height:1.2}
.a5 .card .ttl{font-size:22pt}
.card .lead{font-size:13pt;color:#333;margin-top:2mm;white-space:pre-wrap;line-height:1.5}
.a5 .card .lead{font-size:11pt}
.card .qr{margin:7mm 0 4mm;padding:4mm;border:1mm solid var(--c);border-radius:4mm;background:#fff}
.card .qr img,.card .qr canvas{display:block;width:60mm;height:60mm}
.a5 .card .qr img,.a5 .card .qr canvas{width:42mm;height:42mm}
.card .url{font-size:9.5pt;color:#666;word-break:break-all;max-width:150mm}
.card .wifi{font-size:11pt;color:#333;margin-top:2mm}
.card .wifi b{font-family:ui-monospace,Menlo,monospace;background:#f3f1ec;padding:0 2mm;border-radius:1mm}
.card .foot{position:absolute;bottom:8mm;left:0;right:0;font-size:9pt;color:#777}
.card .wm{position:absolute;right:6mm;bottom:3mm;font-size:8pt;color:#bbb}
.card.empty{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 4mm,#fff 4mm,#fff 8mm)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:12px;display:none}
@media print{body{background:#fff}#app{display:block;height:auto}header,aside,.toast{display:none!important}main{padding:0;overflow:visible;background:#fff}.page{box-shadow:none;margin:0}.card{border-color:#ddd}@page{size:A4;margin:0}}
@media (max-width:1000px){#app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}header{grid-column:1}aside{border-left:0;border-bottom:1px solid var(--line);max-height:50vh}.page{width:100%;height:auto;aspect-ratio:210/297}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="mark">▣</span><span>QR 付き案内板メーカー</span><span style="color:var(--muted);font-weight:400;font-size:11.5px">Wi-Fi・予約・メニュー・SNS</span></div>
    <div class="sp"></div>
    <span class="demo" id="demoBadge" hidden>デモ版: 2 枚まで・透かしあり</span>
    <a href="../../shop/">素材集・製品版 →</a>
  </header>
  <main id="pages"></main>
  <aside>
    <h3>レイアウト</h3>
    <div class="row">
      <div><label>サイズ</label><select id="size"><option value="a4">A4 × 1 面</option><option value="a5">A5 × 2 面（A4 1 枚）</option></select></div>
      <div><label>色</label><div class="sw" id="sw"></div></div>
    </div>
    <label>店名（下に小さく）</label><input type="text" id="shop" placeholder="例: 〇〇カフェ">
    <h3>案内板（1 枚 = 1 つの QR）</h3>
    <div id="signs"></div>
    <div class="row"><button class="btn" id="add">＋ 案内板を追加</button><button class="btn" id="preset">よく使う 4 枚を入れる</button></div>
    <div id="libWarn" class="warn" hidden>QR ライブラリを読み込めませんでした。ネットに接続して再読み込みしてください</div>
    <h3>書き出し</h3>
    <button class="btn primary" id="print">A4 で印刷 / PDF 保存</button>
    <button class="btn" id="pngAll">各案内板を PNG で保存（1080×1350）</button>
    <div class="note">Wi-Fi の案内板は、SSID とパスワードを入れると「読み取るだけで接続」できる QR になります（パスワードは印刷物に載るので掲示場所にご注意ください）。入力はこのブラウザの中（localStorage）にだけ保存され、外部には送信されません。QR の生成もブラウザ内で行います。</div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const DEMO=false; // 製品版 false／デモ版 true（2 枚まで・透かし）
const COLORS=['#111111','#0b3d5c','#1f5a3a','#d7263d','#6b4423','#8a2a4a'];
const KINDS={url:'URL（予約・メニュー・SNS など）',wifi:'Wi-Fi（SSID＋パスワード）',text:'テキスト（住所・連絡先など）'};
const $=id=>document.getElementById(id);
const KEY='qr-sign-v1';
const blank=()=>({kind:'url',icon:'',title:'',lead:'',value:'',ssid:'',pass:'',enc:'WPA',foot:''});
let S=load()||{size:'a4',color:COLORS[1],shop:'',signs:[{kind:'url',icon:'MENU',title:'メニューはこちら',lead:'スマホで QR を読み取ってください\n写真付きで見られます',value:'https://example.com/menu',ssid:'',pass:'',enc:'WPA',foot:'注文はスタッフまで'}]};
if(DEMO)$('demoBadge').hidden=false;
const hasLib=typeof QRCode!=='undefined';if(!hasLib)$('libWarn').hidden=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function wifiStr(s){const e=v=>String(v).replace(/([\;,:"])/g,'\\$1');return `WIFI:T:${s.enc||'WPA'};S:${e(s.ssid)};P:${e(s.pass)};;`;}
function payload(s){return s.kind==='wifi'?wifiStr(s):(s.value||'');}
function buildSide(){
  $('size').value=S.size;$('shop').value=S.shop;
  const sw=$('sw');sw.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===S.color?'on':'';b.onclick=()=>{S.color=c;render();buildSide();};sw.appendChild(b);});
  const box=$('signs');box.innerHTML='';
  S.signs.forEach((s,i)=>{const el=document.createElement('div');el.className='sign';
    el.innerHTML=`<div class="h"><span>案内板 ${i+1}</span><span class="sp"></span><button class="btn sm" data-a="up">↑</button><button class="btn sm" data-a="del">削除</button></div>
      <select data-k="kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${s.kind===k?'selected':''}>${v}</option>`).join('')}</select>
      <div class="row"><input type="text" data-k="icon" placeholder="上の小見出し（例: Wi-Fi／MENU）" value="${esc(s.icon)}"><input type="text" data-k="title" placeholder="見出し（例: ご予約はこちら）" value="${esc(s.title)}"></div>
      <textarea data-k="lead" placeholder="ひとこと（例: スマホで読み取ってください）">${esc(s.lead)}</textarea>
      ${s.kind==='wifi'?`<div class="row"><input type="text" data-k="ssid" placeholder="SSID（ネットワーク名）" value="${esc(s.ssid)}"><input type="text" data-k="pass" placeholder="パスワード" value="${esc(s.pass)}"></div><select data-k="enc"><option value="WPA" ${s.enc==='WPA'?'selected':''}>WPA / WPA2</option><option value="WEP" ${s.enc==='WEP'?'selected':''}>WEP</option><option value="nopass" ${s.enc==='nopass'?'selected':''}>パスワードなし</option></select>`:`<input type="text" data-k="value" placeholder="${s.kind==='url'?'URL（https://...）':'テキスト'}" value="${esc(s.value)}">`}
      <input type="text" data-k="foot" placeholder="下の小さな注記（任意）" value="${esc(s.foot)}">`;
    el.querySelectorAll('[data-k]').forEach(inp=>{const h=()=>{S.signs[i][inp.dataset.k]=inp.value;render();if(inp.dataset.k==='kind')buildSide();};inp.oninput=h;inp.onchange=h;});
    el.querySelector('[data-a=del]').onclick=()=>{S.signs.splice(i,1);if(!S.signs.length)S.signs.push(blank());render();buildSide();};
    el.querySelector('[data-a=up]').onclick=()=>{if(i>0){[S.signs[i-1],S.signs[i]]=[S.signs[i],S.signs[i-1]];render();buildSide();}};
    box.appendChild(el);});
}
$('size').onchange=()=>{S.size=$('size').value;render();};
$('shop').oninput=()=>{S.shop=$('shop').value;render();};
$('add').onclick=()=>{S.signs.push(blank());render();buildSide();};
$('preset').onclick=()=>{S.signs=[
  {kind:'wifi',icon:'Wi-Fi',title:'無料 Wi-Fi をどうぞ',lead:'QR を読み取ると自動で接続できます',value:'',ssid:'ShopWiFi',pass:'password1234',enc:'WPA',foot:'通信内容の保護はご自身でお願いします'},
  {kind:'url',icon:'MENU',title:'メニューはこちら',lead:'スマホで QR を読み取ってください',value:'https://example.com/menu',ssid:'',pass:'',enc:'WPA',foot:''},
  {kind:'url',icon:'RESERVE',title:'ご予約はこちら',lead:'24 時間受付・空席をすぐ確認できます',value:'https://example.com/reserve',ssid:'',pass:'',enc:'WPA',foot:'当日はお電話でも'},
  {kind:'url',icon:'FOLLOW',title:'新着情報は SNS で',lead:'フォローすると限定クーポンが届きます',value:'https://example.com/sns',ssid:'',pass:'',enc:'WPA',foot:''}];render();buildSide();toast('4 枚を入れました（URL は書き換えてください）');};
function visible(){let v=S.signs.filter(s=>s.title||payload(s));if(DEMO)v=v.slice(0,2);return v;}
function render(){
  save();const per=S.size==='a5'?2:1;const v=visible();const pages=Math.max(1,Math.ceil(v.length/per));let html='';
  for(let p=0;p<pages;p++){html+=`<div class="page ${S.size}" style="--c:${S.color}">`;
    for(let k=0;k<per;k++){const s=v[p*per+k];const idx=p*per+k;
      if(!s){html+='<div class="card empty"></div>';continue;}
      html+=`<div class="card">${s.icon?`<div class="ic">${esc(s.icon)}</div>`:''}<div class="ttl">${esc(s.title)}</div>${s.lead?`<div class="lead">${esc(s.lead)}</div>`:''}<div class="qr" id="qr${idx}"></div>
        ${s.kind==='wifi'?`<div class="wifi">ネットワーク名: <b>${esc(s.ssid)}</b>${s.enc!=='nopass'?`　パスワード: <b>${esc(s.pass)}</b>`:''}</div>`:(s.kind==='url'?`<div class="url">${esc(s.value)}</div>`:'')}
        <div class="foot">${esc(s.foot)}${s.foot&&S.shop?'　|　':''}${esc(S.shop)}</div>${DEMO?'<div class="wm">DEMO — QR 付き案内板メーカー</div>':''}</div>`;}
    html+='</div>';}
  $('pages').innerHTML=html;
  if(hasLib)v.forEach((s,i)=>{const el=document.getElementById('qr'+i);const txt=payload(s);if(!txt){el.innerHTML='<div style="width:60mm;height:60mm;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:9pt">URL か Wi-Fi 情報を入力</div>';return;}try{new QRCode(el,{text:txt,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='QR を作れませんでした（文字数が多すぎる可能性）';}});
}
// PNG
function drawSign(s,i){const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const F='"Hiragino Sans","Noto Sans JP",sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle=S.color;x.fillRect(0,0,W,24);x.textAlign='center';x.textBaseline='top';
  let y=90;if(s.icon){x.font=`700 ${34}px ${F}`;const w=x.measureText(s.icon).width+60;x.fillStyle=S.color;x.fillRect(W/2-w/2,y,w,56);x.fillStyle='#fff';x.fillText(s.icon,W/2,y+9);y+=90;}
  x.fillStyle=S.color;x.font=`900 72px ${F}`;x.fillText(s.title||'',W/2,y);y+=100;
  if(s.lead){x.fillStyle='#333';x.font=`500 32px ${F}`;s.lead.split('\n').slice(0,3).forEach(l=>{x.fillText(l,W/2,y);y+=44;});}
  const q=document.querySelector('#qr'+i+' canvas, #qr'+i+' img');const size=560,qy=y+30;x.strokeStyle=S.color;x.lineWidth=10;x.strokeRect(W/2-size/2-24,qy-24,size+48,size+48);
  if(q)x.drawImage(q,W/2-size/2,qy,size,size);y=qy+size+60;
  x.fillStyle='#555';x.font=`500 28px ${F}`;if(s.kind==='wifi'){x.fillText(`ネットワーク名: ${s.ssid}${s.enc!=='nopass'?'　パスワード: '+s.pass:''}`,W/2,y);}else if(s.kind==='url'){x.fillText(String(s.value).slice(0,60),W/2,y);}
  x.fillStyle='#777';x.font=`500 24px ${F}`;x.fillText([s.foot,S.shop].filter(Boolean).join('　|　'),W/2,H-70);
  if(DEMO){x.fillStyle='rgba(0,0,0,.2)';x.font=`900 120px ${F}`;x.fillText('DEMO',W/2,H/2-60);}
  return c;}
function dl(canvas,name){return new Promise(r=>canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(r,300);},'image/png'));}
$('pngAll').onclick=async()=>{const v=visible();if(!v.length)return toast('案内板を入力してください');for(let i=0;i<v.length;i++)await dl(drawSign(v[i],i),`sign_${String(i+1).padStart(2,'0')}_${(v[i].title||'sign').slice(0,10)}.png`);toast(`${v.length} 枚を保存`);};
$('print').onclick=()=>window.print();
let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200);}
buildSide();render();
</script>
</body>
</html>
