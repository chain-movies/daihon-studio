<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト表メーカー｜週間シフトを A4 印刷と一人ずつの画像に</title>
<meta name="description" content="スタッフと曜日ごとの勤務時間を入れるだけで、店に貼る A4 横の週間シフト表と、一人ずつに送る縦長画像（1080×1920）を書き出し。人数・時間の集計、CSV 保存、翌週コピー。ブラウザ内だけで完結。">
<style>
:root{--bg:#0d0d0d;--surface:#1a1a19;--surface2:#232322;--surface3:#2b2b29;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--accent:#e5484d;--warn:#fab219;--ok:#3fb950;--blue:#3987e5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:13.5px;line-height:1.6}
#app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header .logo{display:flex;align-items:center;gap:9px;font-weight:700}
header .logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3987e5,#3fb950);display:flex;align-items:center;justify-content:center;font-size:14px}
header .sp{flex:1}
header a{font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none}
header .demo{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}
main{overflow:auto;padding:16px;background:#2a2a28}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:12px}
h3{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px;letter-spacing:.04em}
label{display:block;font-size:12px;color:var(--ink2);margin:8px 0 2px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;width:100%;margin-top:8px}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.sm{width:auto;padding:3px 9px;font-size:12px;margin:0}
.staff{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface2)}
.staff .h{display:flex;align-items:center;gap:8px}
.staff .h input{flex:1}
.staff .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.staff .g input{padding:5px 4px;font-size:11.5px;text-align:center;border-radius:6px}
.staff .g .d{font-size:10.5px;color:var(--muted);text-align:center}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
/* ---- A4 landscape ---- */
.sheet{width:297mm;min-height:210mm;margin:0 auto;background:#fff;color:#1b1b1b;padding:12mm 14mm;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;position:relative}
.sheet .top{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--c);padding-bottom:3mm;margin-bottom:4mm}
.sheet .ttl{font-size:20pt;font-weight:900;color:var(--c)}
.sheet .shop{font-size:11pt;color:#555}
.sheet .week{font-size:12pt;font-weight:700;text-align:right}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5pt}
.sheet th,.sheet td{border:0.3mm solid #cfcfcf;padding:2.2mm 1.5mm;text-align:center;vertical-align:middle}
.sheet th{background:var(--c);color:#fff;font-weight:700}
.sheet th.name,.sheet td.name{width:34mm;text-align:left;font-weight:700;background:#f6f3ee}
.sheet th:not(.name) small{display:block;font-size:8.5pt;font-weight:500;opacity:.9}
.sheet td.off{color:#bbb}
.sheet td.hol{background:#fff3f3}
.sheet tr.sum td{background:#f6f3ee;font-weight:700;font-size:9.5pt}
.sheet td .n{font-size:8pt;color:#666;display:block}
.sheet .foot{margin-top:4mm;display:flex;justify-content:space-between;font-size:9pt;color:#444;white-space:pre-wrap}
.sheet .wm{position:absolute;right:10mm;bottom:5mm;font-size:8pt;color:#aaa}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:12px;display:none}
@media print{body{background:#fff}#app{display:block;height:auto}header,aside,.toast{display:none!important}main{padding:0;overflow:visible;background:#fff}.sheet{box-shadow:none;margin:0;width:auto;min-height:auto;padding:10mm}@page{size:A4 landscape;margin:0}}
@media (max-width:1100px){#app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}header{grid-column:1}aside{border-left:0;border-bottom:1px solid var(--line);max-height:50vh}.sheet{width:100%;padding:12px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="mark">▦</span><span>シフト表メーカー</span><span style="color:var(--muted);font-weight:400;font-size:11.5px">A4 横＋一人ずつの画像</span></div>
    <div class="sp"></div>
    <span class="demo" id="demoBadge" hidden>デモ版: 3 人まで・透かしあり</span>
    <a href="../../shop/">素材集・製品版 →</a>
  </header>
  <main><div class="sheet" id="sheet"></div></main>
  <aside>
    <h3>基本</h3>
    <input type="text" id="shop" placeholder="店名・部署（例: 〇〇食堂）">
    <div class="row"><div><label>週の初日</label><input type="date" id="start"></div><div><label>色</label><div class="sw" id="sw"></div></div></div>
    <label>休業日（曜日・複数可。例: 水）</label><input type="text" id="holidays" placeholder="例: 水,日">
    <h3>スタッフ（セルに「9-17」「10:00-15:30」「休」「有休」のように入力）</h3>
    <div id="staff"></div>
    <div class="row"><button class="btn" id="add">＋ スタッフを追加</button><button class="btn" id="fillBlank">空欄を「休」で埋める</button></div>
    <label>下のひとこと</label><textarea id="msg" rows="2" placeholder="例: 変更は前日までにグループへ連絡"></textarea>
    <h3>書き出し</h3>
    <button class="btn primary" id="print">A4 横で印刷 / PDF 保存</button>
    <button class="btn" id="pngEach">一人ずつの縦長 PNG（1080×1920）を保存</button>
    <div class="row"><button class="btn" id="csvOut">CSV 保存</button><button class="btn" id="csvIn">CSV 読込</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden></div>
    <div class="row"><button class="btn" id="nextWeek">翌週にコピー</button><button class="btn" id="clear">全部クリア</button></div>
    <div class="note">時間は「9-17」「9:30-18」「13-22」の形で入れると合計時間を自動計算します（休憩は引きません）。入力はこのブラウザの中（localStorage）にだけ保存され、外部には送信されません。</div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const DEMO=false; // 製品版 false／デモ版 true（3 人まで・透かし）
const COLORS=['#0b3d5c','#1f5a3a','#d7263d','#6b4423','#8a2a4a','#3b5f7a'];
const DOW=['日','月','火','水','木','金','土'];
const $=id=>document.getElementById(id);
const KEY='shift-board-v1';
const blank=n=>({name:n||'',days:['','','','','','','']});
let S=load()||{shop:'',start:mondayOf(new Date()),color:COLORS[0],holidays:'',msg:'',staff:[blank('〇〇'),blank('△△'),blank('□□')]};
if(DEMO)$('demoBadge').hidden=false;
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10);}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dateOf(i){const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+i);return d;}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`;}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function isHol(i){const h=(S.holidays||'').replace(/[、\s]/g,',').split(',').filter(Boolean);return h.includes(DOW[dateOf(i).getDay()]);}
function hours(cell){const m=String(cell).replace(/[：]/g,':').replace(/[〜～ー]/g,'-').match(/(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/);if(!m)return 0;const a=+m[1]+(+(m[2]||0))/60,b=+m[3]+(+(m[4]||0))/60;let h=b-a;if(h<0)h+=24;return h;}
function isOff(cell){const c=String(cell).trim();return !c||/^(休|有休|公休|×|-|－)$/.test(c);}
function visibleStaff(){let s=S.staff.filter(x=>x.name);if(DEMO)s=s.slice(0,3);return s;}
function buildSide(){
  $('shop').value=S.shop;$('start').value=S.start;$('holidays').value=S.holidays;$('msg').value=S.msg;
  const sw=$('sw');sw.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===S.color?'on':'';b.onclick=()=>{S.color=c;render();buildSide();};sw.appendChild(b);});
  const box=$('staff');box.innerHTML='';
  S.staff.forEach((st,i)=>{const el=document.createElement('div');el.className='staff';
    el.innerHTML=`<div class="h"><input type="text" data-k="name" placeholder="名前" value="${esc(st.name)}"><button class="btn sm" data-a="up">↑</button><button class="btn sm" data-a="del">削除</button></div>
      <div class="g">${[0,1,2,3,4,5,6].map(d=>`<div class="d">${DOW[dateOf(d).getDay()]}</div>`).join('')}${[0,1,2,3,4,5,6].map(d=>`<input type="text" data-d="${d}" placeholder="9-17" value="${esc(st.days[d])}">`).join('')}</div>`;
    el.querySelector('[data-k=name]').oninput=e=>{S.staff[i].name=e.target.value;render();};
    el.querySelectorAll('[data-d]').forEach(inp=>inp.oninput=()=>{S.staff[i].days[+inp.dataset.d]=inp.value;render();});
    el.querySelector('[data-a=del]').onclick=()=>{S.staff.splice(i,1);if(!S.staff.length)S.staff.push(blank());render();buildSide();};
    el.querySelector('[data-a=up]').onclick=()=>{if(i>0){[S.staff[i-1],S.staff[i]]=[S.staff[i],S.staff[i-1]];render();buildSide();}};
    box.appendChild(el);});
}
['shop','holidays','msg'].forEach(id=>$(id).oninput=()=>{S[id]=$(id).value;render();});
$('start').onchange=()=>{S.start=$('start').value||mondayOf(new Date());render();buildSide();};
$('add').onclick=()=>{S.staff.push(blank());render();buildSide();};
$('fillBlank').onclick=()=>{S.staff.forEach(s=>s.days=s.days.map(c=>c.trim()?c:'休'));render();buildSide();};
function render(){
  save();const sh=$('sheet');sh.style.setProperty('--c',S.color);const st=visibleStaff();
  const first=dateOf(0),last=dateOf(6);
  const head=`<tr><th class="name">スタッフ</th>${[0,1,2,3,4,5,6].map(d=>{const dt=dateOf(d);return `<th>${DOW[dt.getDay()]}<small>${fmt(dt)}${isHol(d)?'・休業':''}</small></th>`;}).join('')}<th>合計</th></tr>`;
  const rows=st.map(s=>{const tot=s.days.reduce((a,c)=>a+hours(c),0);return `<tr><td class="name">${esc(s.name)}</td>${s.days.map((c,d)=>`<td class="${isOff(c)?'off':''} ${isHol(d)?'hol':''}">${isOff(c)?(c.trim()||'休'):esc(c)}${hours(c)?`<span class="n">${fmtH(hours(c))}</span>`:''}</td>`).join('')}<td><b>${fmtH(tot)}</b></td></tr>`;}).join('');
  const sum=`<tr class="sum"><td class="name">出勤人数</td>${[0,1,2,3,4,5,6].map(d=>{const n=st.filter(s=>!isOff(s.days[d])).length;const h=st.reduce((a,s)=>a+hours(s.days[d]),0);return `<td>${n} 人${h?`<span class="n">${fmtH(h)}</span>`:''}</td>`;}).join('')}<td>${fmtH(st.reduce((a,s)=>a+s.days.reduce((b,c)=>b+hours(c),0),0))}</td></tr>`;
  sh.innerHTML=`<div class="top"><div><div class="shop">${esc(S.shop)||'&nbsp;'}</div><div class="ttl">週間シフト表</div></div><div class="week">${fmt(first)}（${DOW[first.getDay()]}）〜 ${fmt(last)}（${DOW[last.getDay()]}）</div></div>
    <table>${head}${rows}${sum}</table><div class="foot"><div>${esc(S.msg)}</div><div>作成日 ${new Date().toLocaleDateString('ja-JP')}</div></div>${DEMO?'<div class="wm">DEMO — シフト表メーカー</div>':''}`;
}
function fmtH(h){if(!h)return '';return (Math.round(h*10)/10).toString().replace(/\.0$/,'')+'h';}
// PNG per staff
function drawStaff(s){const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const F='"Hiragino Sans","Noto Sans JP",sans-serif';const pad=80;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle=S.color;x.fillRect(0,0,W,300);x.fillStyle='#fff';x.textBaseline='top';
  x.font=`600 34px ${F}`;x.fillText(S.shop||'',pad,70);x.font=`900 72px ${F}`;x.fillText(`${s.name} さんのシフト`,pad,120);
  x.font=`600 34px ${F}`;x.fillText(`${fmt(dateOf(0))} 〜 ${fmt(dateOf(6))}`,pad,215);
  const top=360,rowH=180;
  s.days.forEach((cell,d)=>{const dt=dateOf(d);const y=top+d*rowH;const off=isOff(cell);
    x.fillStyle=d%2?'#fff':'#f6f3ee';x.fillRect(pad*0.6,y,W-pad*1.2,rowH-10);
    x.fillStyle=isHol(d)?'#c8102e':S.color;x.font=`900 72px ${F}`;x.fillText(DOW[dt.getDay()],pad,y+30);
    x.fillStyle='#777';x.font=`600 30px ${F}`;x.fillText(fmt(dt),pad,y+118);
    x.fillStyle=off?'#aaa':'#1b1b1b';x.font=`800 ${off?56:68}px ${F}`;x.fillText(off?(cell.trim()||'休'):cell,pad+220,y+40);
    const h=hours(cell);if(h){x.fillStyle='#666';x.font=`600 32px ${F}`;x.textAlign='right';x.fillText(fmtH(h),W-pad,y+60);x.textAlign='left';}
  });
  const tot=s.days.reduce((a,c)=>a+hours(c),0);x.fillStyle=S.color;x.font=`900 48px ${F}`;x.fillText(`週の合計 ${fmtH(tot)||'0h'}`,pad,top+7*rowH+20);
  x.fillStyle='#444';x.font=`500 30px ${F}`;x.fillText((S.msg||'').split('\n')[0].slice(0,30),pad,H-pad-20);
  if(DEMO){x.fillStyle='rgba(0,0,0,.2)';x.font=`900 140px ${F}`;x.textAlign='center';x.fillText('DEMO',W/2,H/2);x.textAlign='left';}
  return c;}
function dl(canvas,name){return new Promise(r=>canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(r,300);},'image/png'));}
$('pngEach').onclick=async()=>{const st=visibleStaff();if(!st.length)return toast('スタッフを入力してください');for(const s of st)await dl(drawStaff(s),`shift_${S.start}_${s.name}.png`);toast(`${st.length} 人分を保存`);};
$('print').onclick=()=>window.print();
// CSV
$('csvOut').onclick=()=>{const rows=[['name',...[0,1,2,3,4,5,6].map(d=>dateOf(d).toISOString().slice(0,10))],...S.staff.map(s=>[s.name,...s.days])];const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`shift_${S.start}.csv`;a.click();toast('CSV を保存');};
$('csvIn').onclick=()=>$('csvFile').click();
$('csvFile').onchange=()=>{const f=$('csvFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=r.result.replace(/^﻿/,'').split(/\r?\n/).filter(Boolean);const parse=l=>l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(c=>c.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'));
  const head=parse(lines[0]);if(/^\d{4}-\d{2}-\d{2}$/.test(head[1]||''))S.start=head[1];
  S.staff=lines.slice(1).map(parse).map(c=>({name:c[0]||'',days:[1,2,3,4,5,6,7].map(i=>c[i]||'')}));if(!S.staff.length)S.staff.push(blank());render();buildSide();toast(`${S.staff.length} 人を読み込み`);};r.readAsText(f);$('csvFile').value='';};
$('nextWeek').onclick=()=>{const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+7);S.start=d.toISOString().slice(0,10);render();buildSide();toast('日付を翌週に（シフトはそのまま）');};
$('clear').onclick=()=>{if(!confirm('シフトを全部消しますか？（名前は残ります）'))return;S.staff.forEach(s=>s.days=['','','','','','','']);render();buildSide();};
let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200);}
buildSide();render();
</script>
</body>
</html>
