<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a19">
<title>サムネ文字メーカー｜YouTubeサムネイルの文字をテレビ風に</title>
<script src="../../telop/designs.js"></script>
<script>
  (function () { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = TelopDesigns.googleFontsHref(); document.head.appendChild(l); })();
</script>
<script src="../../telop/renderer.js"></script>
<style>
:root{--bg:#0d0d0d;--surface:#1a1a19;--surface2:#232322;--surface3:#2b2b29;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--accent:#e5484d;--accent-soft:rgba(229,72,77,.16);--warn:#fab219;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:13.5px;line-height:1.6}
#app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header .logo{display:flex;align-items:center;gap:9px;font-weight:700}
header .logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#e5484d,#ff9a3d);display:flex;align-items:center;justify-content:center;font-size:14px}
header .sp{flex:1}
header .demo{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:10px;overflow:hidden}
#stage{position:relative;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:6px;overflow:hidden;background:#222;cursor:move;touch-action:none}
#stage canvas{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto}
.hint{color:var(--muted);font-size:12px}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:12px}
.label{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin:12px 0 6px}
.label:first-child{margin-top:0}
select,input[type=text],textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
textarea{resize:vertical;min-height:52px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.row .v{width:44px;text-align:right;color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;width:100%}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:8px}
.tabs button{flex:1;border:none;background:transparent;color:var(--ink2);padding:6px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
.tabs button.on{background:var(--accent-soft);color:#ffb3b5;font-weight:600}
.tabs button.off{opacity:.45;text-decoration:line-through}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:12px}
.sw.on{border-color:var(--accent);color:#ffb3b5;background:var(--accent-soft)}
.bgs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bg{height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.bg.on{border-color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--accent)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:52px auto auto;height:auto}header{grid-column:1}aside{border-left:none;border-top:1px solid var(--line)}#stage canvas{max-height:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="mark">T</span><span>サムネ文字メーカー</span><span style="color:var(--muted);font-weight:400;font-size:11.5px">YouTube 1280×720</span></div>
    <div class="sp"></div>
    <a class="demo" href="../../shop/" style="text-decoration:none;color:var(--ink);border-color:var(--line)">素材集・製品版 →</a>
    <span class="demo" id="demoBadge" hidden>デモ版：書き出しに SAMPLE 透かし</span>
  </header>

  <main>
    <div id="stage"><canvas id="preview" width="1280" height="720"></canvas><div class="toast" id="toast"></div></div>
    <div class="hint">プレビュー上でドラッグすると選択中の文字を動かせます。書き出しは 1280×720（YouTube推奨サイズ）。</div>
  </main>

  <aside>
    <div class="label">背景</div>
    <div class="bgs" id="bgs"></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="bgUpload" style="width:auto;flex:1">📷 画像を選ぶ</button><button class="btn" id="bgClear" style="width:auto">✕</button></div>
    <input type="file" id="bgfile" accept="image/*" hidden>
    <div class="label">暗さ（文字を読みやすく）</div>
    <div class="row"><input type="range" id="dim" min="0" max="80" value="20"><span class="v" id="dimV">20%</span></div>
    <div class="label">ぼかし</div>
    <div class="row"><input type="range" id="blur" min="0" max="20" value="0"><span class="v" id="blurV">0</span></div>
    <hr>
    <div class="label">文字レイヤー</div>
    <div class="tabs" id="tabs"><button data-i="0">上</button><button data-i="1" class="on">メイン</button><button data-i="2">下</button></div>
    <div style="margin-top:8px"><label class="check"><input type="checkbox" id="lyOn"> このレイヤーを表示</label></div>
    <div class="label">テキスト（改行OK）</div>
    <textarea id="text"></textarea>
    <div class="label">デザイン</div>
    <select id="design"></select>
    <div class="label">カラー</div>
    <div class="swatches" id="variants"></div>
    <div class="label">大きさ</div>
    <div class="row"><input type="range" id="scale" min="30" max="220" value="100"><span class="v" id="scaleV">100%</span></div>
    <div class="label">位置（左右 / 上下）</div>
    <div class="row"><input type="range" id="offX" min="-600" max="600" value="0"><span class="v" id="offXV">0</span></div>
    <div class="row"><input type="range" id="offY" min="-340" max="340" value="0"><span class="v" id="offYV">0</span></div>
    <hr>
    <button class="btn primary" id="dlPng">⬇ PNG で書き出し</button>
    <button class="btn" id="dlJpg" style="margin-top:8px">⬇ JPG で書き出し（軽い）</button>
    <button class="btn" id="reset" style="margin-top:8px">↺ 初期レイアウトに戻す</button>
    <div class="hint" style="margin-top:10px">© Chain-Movies. フォントは Google Fonts（オープンライセンス）。デザインは「テロップメーカー」と共通。</div>
  </aside>
</div>

<script>
(function () {
  const DEMO = /* @DEMO */ true; /* @DEMO */
  const R = TelopRenderer, D = TelopDesigns;
  const $ = (s) => document.querySelector(s);
  const W = 1280, H = 720;
  if (DEMO) $('#demoBadge').hidden = false;

  const BGS = [
    ['#111111', '#111111'], ['#1c2541', '#3a506b'], ['#0b3d2e', '#1e6f5c'], ['#4a1942', '#893168'], ['#7a1f1f', '#e5484d'], ['#f5f5f5', '#dcdcdc'],
    ['#ff9a3d', '#ffd23f'], ['#0f3460', '#16213e'], ['#2b2d42', '#8d99ae'], ['#3a0ca3', '#f72585'], ['#004e64', '#00a5cf'], ['#fff1e6', '#ffd8be'],
  ];
  const defaultLayers = () => ([
    { on: true, text: '今日の本題は', design: 'business', variant: 0, scale: 80, offX: 0, offY: -220 },
    { on: true, text: '知らないと損する\n3つの落とし穴', design: 'variety-tsukkomi', variant: 0, scale: 130, offX: 0, offY: 10 },
    { on: true, text: '初心者向け', design: 'news-flash', variant: 0, scale: 70, offX: 0, offY: 250 },
  ]);
  const state = { bg: 1, bgImg: null, dim: 20, blur: 0, cur: 1, layers: defaultLayers() };
  try { const s = JSON.parse(localStorage.getItem('thumbmaker') || 'null'); if (s && s.layers) Object.assign(state, s, { bgImg: null }); } catch (e) {}
  const save = () => { try { localStorage.setItem('thumbmaker', JSON.stringify({ bg: state.bg, dim: state.dim, blur: state.blur, cur: state.cur, layers: state.layers })); } catch (e) {} };
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); };
  let bgImage = null;

  /* ---- UI 構築 ---- */
  $('#bgs').innerHTML = BGS.map((b, i) => `<div class="bg${i === state.bg ? ' on' : ''}" data-i="${i}" style="background:linear-gradient(135deg,${b[0]},${b[1]})"></div>`).join('');
  $('#bgs').querySelectorAll('.bg').forEach((el) => el.onclick = () => { state.bg = +el.dataset.i; bgImage = null; syncBg(); save(); draw(); });
  $('#design').innerHTML = D.DESIGNS.map((d) => `<option value="${d.id}">${d.category}｜${d.name}</option>`).join('');
  function syncBg() { $('#bgs').querySelectorAll('.bg').forEach((el) => el.classList.toggle('on', +el.dataset.i === state.bg && !bgImage)); }
  function syncLayer() {
    const L = state.layers[state.cur];
    document.querySelectorAll('#tabs button').forEach((b) => { b.classList.toggle('on', +b.dataset.i === state.cur); b.classList.toggle('off', !state.layers[+b.dataset.i].on); });
    $('#lyOn').checked = L.on; $('#text').value = L.text; $('#design').value = L.design;
    const d = D.DESIGNS.find((x) => x.id === L.design) || D.DESIGNS[0];
    $('#variants').innerHTML = (d.variants || []).map((v, i) => `<span class="sw${i === L.variant ? ' on' : ''}" data-i="${i}">${v.name}</span>`).join('');
    $('#variants').querySelectorAll('.sw').forEach((s) => s.onclick = () => { L.variant = +s.dataset.i; syncLayer(); save(); draw(); });
    $('#scale').value = L.scale; $('#scaleV').textContent = L.scale + '%';
    $('#offX').value = L.offX; $('#offXV').textContent = L.offX; $('#offY').value = L.offY; $('#offYV').textContent = L.offY;
    $('#dim').value = state.dim; $('#dimV').textContent = state.dim + '%'; $('#blur').value = state.blur; $('#blurV').textContent = state.blur;
  }

  /* ---- 描画 ---- */
  const off = document.createElement('canvas');
  async function compose(target, wm) {
    const ctx = target.getContext('2d'); target.width = W; target.height = H;
    // 背景
    if (bgImage) {
      const s = Math.max(W / bgImage.width, H / bgImage.height);
      const w = bgImage.width * s, h = bgImage.height * s;
      ctx.save(); if (state.blur) ctx.filter = `blur(${state.blur}px)`;
      ctx.drawImage(bgImage, (W - w) / 2, (H - h) / 2, w, h); ctx.restore();
    } else {
      const b = BGS[state.bg] || BGS[0]; const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, b[0]); g.addColorStop(1, b[1]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (state.dim) { ctx.fillStyle = `rgba(0,0,0,${state.dim / 100})`; ctx.fillRect(0, 0, W, H); }
    // 文字レイヤー
    for (const L of state.layers) {
      if (!L.on || !L.text.trim()) continue;
      const d0 = D.DESIGNS.find((x) => x.id === L.design) || D.DESIGNS[0];
      const d = Object.assign({}, d0, { anchor: { x: 'center', y: 'middle', margin: 0 }, portraitScale: 1 });
      await R.ensureFonts(R.resolve(d, L.variant), [L.text]);
      R.render(off, d, { width: W, height: H, variant: L.variant, text: L.text, sub: '', scale: (L.scale / 100) * 0.7, offsetX: L.offX / 0.7 / (L.scale / 100), offsetY: L.offY / 0.7 / (L.scale / 100), noFit: true });
      ctx.drawImage(off, 0, 0);
    }
    if (wm && DEMO) { ctx.save(); ctx.font = '700 26px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 4; ctx.textAlign = 'right'; ctx.strokeText('SAMPLE - thumb maker', W - 20, H - 20); ctx.fillText('SAMPLE - thumb maker', W - 20, H - 20); ctx.restore(); }
  }
  let drawing = false, queued = false;
  async function draw() { if (drawing) { queued = true; return; } drawing = true; try { await compose($('#preview'), false); } finally { drawing = false; if (queued) { queued = false; draw(); } } }

  /* ---- 書き出し ---- */
  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const fname = () => (state.layers[1].text || state.layers[0].text || 'thumbnail').replace(/\n/g, ' ').replace(/[\\/:*?"<>|]/g, '').slice(0, 24);
  async function exportAs(type, q) { const c = document.createElement('canvas'); await compose(c, true); c.toBlob((b) => { download(b, `サムネ_${fname()}.${type === 'image/jpeg' ? 'jpg' : 'png'}`); toast('書き出しました'); }, type, q); }
  $('#dlPng').onclick = () => exportAs('image/png');
  $('#dlJpg').onclick = () => exportAs('image/jpeg', 0.92);
  $('#reset').onclick = () => { state.layers = defaultLayers(); state.cur = 1; syncLayer(); save(); draw(); };

  /* ---- イベント ---- */
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => { state.cur = +b.dataset.i; syncLayer(); save(); });
  $('#lyOn').onchange = (e) => { state.layers[state.cur].on = e.target.checked; syncLayer(); save(); draw(); };
  $('#text').oninput = (e) => { state.layers[state.cur].text = e.target.value; save(); draw(); };
  $('#design').onchange = (e) => { const L = state.layers[state.cur]; L.design = e.target.value; L.variant = 0; syncLayer(); save(); draw(); };
  $('#scale').oninput = (e) => { state.layers[state.cur].scale = +e.target.value; $('#scaleV').textContent = e.target.value + '%'; save(); draw(); };
  $('#offX').oninput = (e) => { state.layers[state.cur].offX = +e.target.value; $('#offXV').textContent = e.target.value; save(); draw(); };
  $('#offY').oninput = (e) => { state.layers[state.cur].offY = +e.target.value; $('#offYV').textContent = e.target.value; save(); draw(); };
  $('#dim').oninput = (e) => { state.dim = +e.target.value; $('#dimV').textContent = state.dim + '%'; save(); draw(); };
  $('#blur').oninput = (e) => { state.blur = +e.target.value; $('#blurV').textContent = state.blur; save(); draw(); };
  $('#bgUpload').onclick = () => $('#bgfile').click();
  $('#bgClear').onclick = () => { bgImage = null; syncBg(); draw(); };
  $('#bgfile').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { bgImage = img; syncBg(); draw(); }; img.src = URL.createObjectURL(f); };
  // ドラッグで移動
  const stage = $('#preview'); let drag = null;
  stage.addEventListener('pointerdown', (e) => { const r = stage.getBoundingClientRect(); drag = { x: e.clientX, y: e.clientY, ox: state.layers[state.cur].offX, oy: state.layers[state.cur].offY, k: W / r.width }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', (e) => { if (!drag) return; const L = state.layers[state.cur]; L.offX = Math.round(drag.ox + (e.clientX - drag.x) * drag.k); L.offY = Math.round(drag.oy + (e.clientY - drag.y) * drag.k); $('#offX').value = L.offX; $('#offXV').textContent = L.offX; $('#offY').value = L.offY; $('#offYV').textContent = L.offY; draw(); });
  stage.addEventListener('pointerup', () => { drag = null; save(); });
  window.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); exportAs('image/png'); } });

  syncBg(); syncLayer(); draw();
})();
</script>
</body>
</html>
