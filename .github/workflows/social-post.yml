name: SNS 自動投稿

on:
  schedule:
    # 15分おきに、予定時刻を過ぎた投稿を送る（GitHub の cron は数分遅れることがある）
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せず内容だけ確認する'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 投稿
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/social/post.mjs

      - name: キューと履歴を書き戻す
        if: always()
        run: |
          if [ -n "$(git status --porcelain content/social)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/social
            git commit -m "chore(social): 投稿結果を反映"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((2 ** i))
            done
            echo "::error::キューの書き戻しに失敗しました" && exit 1
          else
            echo "変更なし"
          fi
